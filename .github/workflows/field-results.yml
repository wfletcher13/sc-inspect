name: field-results tool

on:
  push:
    paths: ['index.html', 'tools/field-results/**', '.github/workflows/field-results.yml']
  pull_request:
    paths: ['index.html', 'tools/field-results/**', '.github/workflows/field-results.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test (reads the data model from index.html, so app changes that break it fail here)
        working-directory: tools/field-results
        run: npm test
