<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SC Inspect</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#196b24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SC Inspect">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --font-head:'Montserrat',system-ui,sans-serif;
  --font-ui:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bg:#f4f7f3; --bg2:#ffffff; --bg3:#f8faf7; --bg4:#eef2ec;
  --line:#d9e1d8; --line2:#c2cdc1;
  --ink:#1b2a1f; --ink2:#55665a; --ink3:#8a988e;
  --accent:#196b24; --accent2:#125219; --accent-bg:#e6f2e7; --accent-bd:#b9d8bd; --on-accent:#ffffff;
  --pass:#1f8a3b; --pass-bg:#e8f5ec; --pass-bd:#b5dcbf;
  --fail:#c43b2e; --fail-bg:#fbeae8; --fail-bd:#eebbb5;
  --warn:#b07a12; --warn-bg:#fbf3df; --warn-bd:#ecd59a;
  --na:#6b7a70; --na-bg:#eef1ee; --na-bd:#cfd7d0;
  --info:#2f5f8a; --info-bg:#e8f0f8; --info-bd:#bcd2e6;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 6px 20px -12px rgba(20,40,25,.25);
  --r:8px; --rl:12px;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0f1511; --bg2:#171f19; --bg3:#1b241d; --bg4:#222d25;
  --line:#2b3a2f; --line2:#3b4c40;
  --ink:#e6ece7; --ink2:#a5b3a8; --ink3:#71806f;
  --accent:#4fae5b; --accent2:#6cc377; --accent-bg:#183a1f; --accent-bd:#2a5c33; --on-accent:#08130a;
  --pass:#5cc274; --pass-bg:#173622; --pass-bd:#27583a;
  --fail:#f0776a; --fail-bg:#3d1e1a; --fail-bd:#66302a;
  --warn:#e2b04a; --warn-bg:#3a2e12; --warn-bd:#5d4a1c;
  --na:#9aa89d; --na-bg:#232c25; --na-bd:#3a463c;
  --info:#7fb1e0; --info-bg:#182735; --info-bd:#2b435c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0f1511; --bg2:#171f19; --bg3:#1b241d; --bg4:#222d25;
  --line:#2b3a2f; --line2:#3b4c40;
  --ink:#e6ece7; --ink2:#a5b3a8; --ink3:#71806f;
  --accent:#4fae5b; --accent2:#6cc377; --accent-bg:#183a1f; --accent-bd:#2a5c33; --on-accent:#08130a;
  --pass:#5cc274; --pass-bg:#173622; --pass-bd:#27583a;
  --fail:#f0776a; --fail-bg:#3d1e1a; --fail-bd:#66302a;
  --warn:#e2b04a; --warn-bg:#3a2e12; --warn-bd:#5d4a1c;
  --na:#9aa89d; --na-bg:#232c25; --na-bd:#3a463c;
  --info:#7fb1e0; --info-bg:#182735; --info-bd:#2b435c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg4);color:var(--ink2);border-radius:var(--r);padding:7px 12px;font-size:13px;font-weight:500;transition:background .12s,border-color .12s,color .12s}
button:hover{border-color:var(--line2);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2);color:var(--on-accent)}
.btn-danger{background:var(--fail-bg);border-color:var(--fail-bd);color:var(--fail)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-block{width:100%;justify-content:center;display:inline-flex}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:64px;line-height:1.5}
label.lbl,.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px;font-family:var(--font-head)}
.field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr}}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:12px}
.tag{font-family:var(--font-mono);font-weight:600;color:var(--accent)}

/* layout */
#app{display:flex;height:100dvh;overflow:hidden}
aside.side{width:250px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100dvh}
.side-head{padding:14px 16px 10px;border-bottom:2px solid var(--accent)}
.brand{display:flex;align-items:center;gap:9px}
.brand{gap:10px}
.brand-logo{height:30px;width:auto;display:block}
/* the wordmark is navy, so in dark mode it sits on a small white plate to stay legible */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .brand-logo{background:#fff;border-radius:6px;padding:4px 7px;height:36px} }
:root[data-theme="dark"] .brand-logo{background:#fff;border-radius:6px;padding:4px 7px;height:36px}
@media (max-width:900px){ .brand-logo{height:26px} }
.brand-name{font-family:var(--font-head);font-weight:700;font-size:14px}
.brand-sub{font-size:11px;color:var(--ink3);margin-top:-2px}
.sync{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink2)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--na)}
.sync.ok .dot{background:var(--pass)} .sync.pending .dot{background:var(--warn)} .sync.offline .dot{background:var(--fail)} .sync.local .dot{background:var(--na)}
nav.views{flex:1;overflow-y:auto;padding:6px 0}
nav.views button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 16px;background:none;border:none;border-left:3px solid transparent;border-radius:0;color:var(--ink2);font-size:14px;text-align:left;min-height:42px}
nav.views button.on{background:var(--bg4);border-left-color:var(--accent);color:var(--accent);font-weight:600}
nav.views button .cnt{margin-left:auto;font-size:11px;background:var(--bg4);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--ink2);font-family:var(--font-mono)}
nav.views button.on .cnt{background:var(--accent-bg);border-color:var(--accent-bd)}
nav.views .sep{height:1px;background:var(--line);margin:6px 16px}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
main.content{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg2);border-bottom:2px solid var(--accent);flex-wrap:wrap}
.topbar h1{font-size:16px;font-weight:700}
.topbar .grow{flex:1}
.topbar select{width:auto;max-width:260px;padding:6px 8px;font-size:13px}
.scroll{flex:1;overflow-y:auto;padding:16px 20px 90px;-webkit-overflow-scrolling:touch}
.wrap{max-width:1150px}
.mobile-nav{display:none}
.mobile-bar{display:none}
@media (max-width:900px){
  aside.side{display:none}
  .scroll{padding:12px 14px 96px}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .mobile-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;background:none;border:none;border-top:2.5px solid transparent;border-radius:0;color:var(--ink3);font-size:9.5px;font-weight:700;letter-spacing:.03em;min-width:0}
  .mobile-nav button.on{color:var(--accent);border-top-color:var(--accent)}
  .mobile-nav button svg{width:20px;height:20px}
  .mobile-bar{display:flex}
}
/* section card */
.sec{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rl);margin-bottom:12px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none}
.sec-h h3{font-size:13.5px;font-weight:600;flex:1}
.sec-h .chev{transition:transform .15s;color:var(--ink3)}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-b{padding:4px 16px 16px;border-top:1px solid var(--line)}
.sec-b.nopad{padding:0}
.card{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.hint{font-size:12px;color:var(--ink2);line-height:1.55;margin:0 0 10px}
.empty{padding:22px 12px;text-align:center;color:var(--ink3);font-size:13px}
/* toggles */
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tog-row:last-child{border-bottom:none}
.switch{position:relative;width:40px;height:22px;flex-shrink:0}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line2);border-radius:11px;transition:.15s}
.switch span::after{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-bg);border:1px solid var(--accent-bd);color:var(--accent);border-radius:6px;padding:2px 6px 2px 10px;font-size:12px;font-weight:500}
.chip button{background:none;border:none;color:var(--ink3);padding:0 3px;font-size:14px;line-height:1}
.stepper{display:inline-flex;align-items:center}
.stepper button{width:28px;height:28px;padding:0;font-size:16px;line-height:1}
.stepper span{width:34px;height:28px;display:grid;place-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:13px;background:var(--bg3)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--font-head);font-size:20px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat.pass b{color:var(--pass)} .stat.fail b{color:var(--fail)} .stat.warn b{color:var(--warn)}
/* result rows */
.rr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rr:last-child{border-bottom:none}
.rr-info{flex:1;min-width:0}
.rr-name{font-size:13.5px;font-weight:500}
.rr-ev{font-size:11.5px;color:var(--ink3)}
.rr-exp{font-size:11.5px;color:var(--ink2);font-style:italic}
.pfn{display:inline-flex;gap:3px;flex-shrink:0}
.pfn button{min-width:44px;height:38px;padding:0 10px;font-weight:700;font-size:13px;font-family:var(--font-mono);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pfn button.p{background:var(--pass);border-color:var(--pass);color:#fff}
.pfn button.f{background:var(--fail);border-color:var(--fail);color:#fff}
.pfn button.n{background:var(--na);border-color:var(--na);color:#fff}
/* matrix */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--bg2)}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
table.mx th{position:sticky;top:0;background:var(--bg4);color:var(--ink2);font-weight:600;font-size:11px;letter-spacing:.03em;padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
table.mx th:first-child,table.mx td:first-child{position:sticky;left:0;background:var(--bg4);z-index:3;text-align:left;font-family:var(--font-mono);font-weight:600;padding-left:10px}
table.mx td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.mx tr:last-child td{border-bottom:none}
.mc{display:block}
.mc button{display:block;width:100%;min-width:54px;height:38px;padding:0;font-size:14px;font-weight:700;font-family:var(--font-mono);border-radius:6px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mc button.e{color:var(--ink2);opacity:.55}
.mc button.p{background:var(--pass);border-color:var(--pass);color:#fff}
.mc button.f{background:var(--fail);border-color:var(--fail);color:#fff}
.mc button.n{background:var(--na);border-color:var(--na);color:#fff}
td.cp{background:var(--pass-bg)} td.cf{background:var(--fail-bg)} td.cn{background:var(--na-bg)}
/* pressure */
.pgrid{display:grid;gap:4px;align-items:center;margin-bottom:4px}
.pgrid .ph{font-size:10.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.pgrid .pf{font-family:var(--font-mono);font-weight:600;font-size:12.5px}
.pgrid input{padding:6px 4px;font-size:13px;min-width:0;text-align:center}
/* by-floor rows: label beside the readings on a laptop, above them on a phone */
.prow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:4px}
.prow .pin{display:grid;grid-template-columns:1fr 1fr 1fr 92px;gap:4px;align-items:center}
.prow .pin.noc{grid-template-columns:1fr 1fr 1fr}
.prow .pf{font-family:var(--font-mono);font-weight:600;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){
  .prow{display:block;margin-bottom:9px}
  .prow .pf{margin-bottom:3px;white-space:normal}
  .prow .pin{grid-template-columns:1fr 1fr 1fr 74px;gap:3px}
  .prow .ph{font-size:9.5px;letter-spacing:0}
  .prow input{font-size:12px;padding:6px 2px}
}
@media (max-width:560px){.pgrid{grid-template-columns:58px 1fr 1fr 1fr 72px !important;gap:3px}.pgrid.noc{grid-template-columns:58px 1fr 1fr 1fr !important}.pgrid .ph{font-size:9.5px;letter-spacing:0}.pgrid input{font-size:12px;padding:6px 2px}.cl-btn{font-size:9px;padding:0}}
.pgrid input.bad{border-color:var(--fail);background:var(--fail-bg);color:var(--fail)}
.cl-btn{width:100%;height:32px;font-size:10px;font-weight:700;font-family:var(--font-mono);letter-spacing:.05em}
.cl-btn.pass{background:var(--pass-bg);border-color:var(--pass-bd);color:var(--pass)}
.cl-btn.fail{background:var(--fail-bg);border-color:var(--fail-bd);color:var(--fail)}
.subtabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{flex:1;min-width:80px;font-weight:600}
.subtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* badges */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;border:1px solid;letter-spacing:.02em}
.b-def{color:var(--fail);background:var(--fail-bg);border-color:var(--fail-bd)}
.b-obs{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.b-note{color:var(--na);background:var(--na-bg);border-color:var(--na-bd)}
.b-ok{color:var(--pass);background:var(--pass-bg);border-color:var(--pass-bd)}
.b-info{color:var(--info);background:var(--info-bg);border-color:var(--info-bd)}
.b-crit{color:#fff;background:var(--fail);border-color:var(--fail)}
/* deficiencies */
.def{border:1px solid var(--line);border-left:4px solid var(--fail);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;background:var(--bg2)}
.def.obs{border-left-color:var(--warn)} .def.note{border-left-color:var(--na)}
.def-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.def-h .loc{font-family:var(--font-mono);font-size:12px;color:var(--ink2)}
.def-act{font-size:12.5px;color:var(--ink2);margin-top:4px}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.photos .add{width:72px;height:72px;border:1px dashed var(--line2);border-radius:6px;display:grid;place-items:center;color:var(--ink3);font-size:11px;text-align:center;cursor:pointer;background:var(--bg3)}
/* open items */
.oi{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;background:var(--bg2)}
.oi.resolved{opacity:.7}
.oi-h{display:flex;gap:8px;align-items:flex-start}
.oi-h b{flex:1;font-weight:600;font-size:13.5px}
.oi p{margin:4px 0;font-size:12.5px;color:var(--ink2)}
.oi .st{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;align-items:center}
.oi .st button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* dashboard */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.hero h2{font-size:22px;font-weight:700}
.hero p{margin:2px 0 0;color:var(--ink2)}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.bcard{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rl);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.bcard h3{font-size:15px;font-weight:600}
.bcard .addr{font-size:12px;color:var(--ink3)}
.bcard .meta{display:flex;gap:10px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.bcard .prog{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.bcard .prog i{display:block;height:100%;background:var(--accent)}
.bcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.dtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.dtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* reports */
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rep .card{margin:0;display:flex;flex-direction:column;gap:8px}
.rep h4{font-size:14px;font-weight:600}
.rep p{margin:0;font-size:12.5px;color:var(--ink2)}
.scan{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:3/4;max-height:52vh;display:grid;place-items:center}
.scan video{width:100%;height:100%;object-fit:cover}
.panel-shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.panel-thumb{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:6px;text-align:left;background:var(--bg3);border:1px solid var(--line);border-radius:8px;height:auto}
.panel-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}
.findbox{width:auto;flex:1;min-width:170px;padding:7px 10px;font-size:13px}
.eqa{border:1px solid var(--line);border-radius:var(--r);background:var(--bg2);margin-bottom:8px;overflow:hidden}
.eqa-h{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg2);border:0;border-radius:0;text-align:left;min-height:46px}
.eqa-h .tag{font-size:14px;flex-shrink:0}
.eqa-sub{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eqa-st{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:10px;background:var(--bg4);border:1px solid var(--line);color:var(--ink3);flex-shrink:0}
.eqa-st.pass{background:var(--pass-bg);border-color:var(--pass-bd);color:var(--pass)}
.eqa-st.fail{background:var(--fail-bg);border-color:var(--fail-bd);color:var(--fail)}
.eqa-st.part{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.eqa .chev{flex-shrink:0;transition:transform .15s;color:var(--ink3)}
.eqa.on .chev{transform:rotate(180deg)}
.eqa-b{display:none;padding:0 12px 10px;border-top:1px solid var(--line)}
.eqa.on .eqa-b{display:block}
@media (max-width:560px){ .eqa-sub{display:none} }
.lanes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:4px}
.seg button{border:0;border-radius:0;background:var(--bg3);padding:8px 16px;font-size:13px;min-width:74px}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}
.chk input{width:auto}
/* drawings & documents */
.rowflex{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn-file{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg3);font-size:13px;cursor:pointer}
.btn-file.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.file-card{display:flex;flex-direction:column;gap:8px}
.file-card h4{word-break:break-word}
.ok-tag{color:var(--accent);font-weight:600}
.modal:has(.fv){width:min(980px,96vw);max-width:96vw}
.fv{background:var(--bg4);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:72vh;-webkit-overflow-scrolling:touch}
.fv:has(.fv-img),.fv:has(.empty){display:grid;place-items:center}
.fv-page{display:block;width:100%;height:auto;margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.fv-doc{background:#fff;color:#1b2a1f;padding:18px 20px;font-size:13px;line-height:1.6}
.fv-doc table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12px}
.fv-doc td,.fv-doc th{border:1px solid #d9e1d8;padding:4px 6px;vertical-align:top}
.fv-doc h1,.fv-doc h2,.fv-doc h3{font-family:var(--font-head);color:#196b24;margin:12px 0 4px}
.fv-doc img{max-width:100%;height:auto}
.fv-img{max-width:100%;height:auto;display:block}
.fv-frame{width:100%;height:70vh;border:0;background:#fff}
pre.prompt{font-family:var(--font-mono);font-size:11.5px;background:var(--bg4);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;margin:0;color:var(--ink)}
/* chat */
.chat-fab{position:fixed;right:18px;bottom:18px;z-index:45;width:52px;height:52px;border-radius:50%;background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
@media (max-width:900px){.chat-fab{bottom:74px}}
.chat{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--bg2);border-left:1px solid var(--line);z-index:60;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s}
.chat.open{transform:none}
@media (prefers-reduced-motion:reduce){.chat{transition:none}}
.chat-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-h h3{flex:1;font-size:14px}
.chat-log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:8px 12px;border-radius:12px;font-size:13.5px;white-space:pre-wrap;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--bg4);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.t{align-self:flex-start;font-size:11.5px;color:var(--ink3);font-family:var(--font-mono);padding:2px 6px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.quick button{background:var(--bg3);font-size:12px}
.chat-in{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
#chatMic{flex-shrink:0;width:40px;height:40px;padding:0;display:grid;place-items:center}
#chatMic.rec{background:var(--fail);border-color:var(--fail);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#chatMic.rec{animation:none}}
.chat-in textarea{min-height:40px;max-height:120px;padding:8px 10px}
/* toast + modal */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;display:flex;gap:10px;align-items:center;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:inherit;padding:2px 9px;font-size:12px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:var(--rl);padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal h3{font-size:16px;margin-bottom:10px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:90;display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:6px}
.flag{font-size:11px;color:var(--fail);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.seqrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.seqrow textarea{min-height:44px}
@media (max-width:560px){.seqrow{grid-template-columns:1fr}}
.zn{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;background:var(--bg2)}
.zn-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.zn-h .z{font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:14px}
.zn-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
@media (max-width:560px){.zn-cells{grid-template-columns:1fr}}
.zn-cells .c{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink2)}
.res{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;border:1px solid}
.res.pass{color:var(--pass);background:var(--pass-bg);border-color:var(--pass-bd)}
.res.fail{color:var(--fail);background:var(--fail-bg);border-color:var(--fail-bd)}
.res.partial{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.res.none{color:var(--ink3);background:var(--bg4);border-color:var(--line)}
/* PRINT_CSS_INJECTED at runtime by 35-ui-print.js */
</style>

</head>
<body>
<div id="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand"><img class="brand-logo" src="./logo.png" alt="EB Life Safety" width="180" height="44"><div class="brand-name">SC Inspect</div></div>
      <div class="sync local" id="syncBadge"><span class="dot"></span><span id="syncLabel">Local only</span></div>
    </div>
    <nav class="views" id="sideNav"></nav>
    <div class="side-foot">
      <button class="btn-primary btn-block" id="btnNewSide">+ New building</button>
      <button class="btn-block" id="btnHomeSide">All buildings</button>
      <button class="btn-block" id="btnSettingsSide">Settings</button>
    </div>
  </aside>
  <main class="content">
    <div class="topbar" id="topbar"></div>
    <div class="scroll" id="scroll"><div class="wrap" id="view"></div></div>
  </main>
  <nav class="mobile-nav" id="mobileNav"></nav>
</div>
<button class="chat-fab" id="chatFab" title="Ask about this project" hidden>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6a8 8 0 0 1 8-8h2a8 8 0 0 1 8 3"/></svg>
</button>
<div class="chat" id="chat">
  <div class="chat-h"><h3>Ask about this project</h3><button class="btn-sm" id="chatClear">Clear</button><button class="btn-sm" id="chatClose">Close</button></div>
  <div class="chat-log" id="chatLog"></div>
  <div class="chat-in"><button id="chatMic" title="Dictate" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0014 0M12 17v5"/></svg></button><textarea id="chatText" placeholder="Type or dictate, e.g. mark SPF-3 belt-off as fail" rows="1"></textarea><button class="btn-primary" id="chatSend">Send</button></div>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<div id="printRoot"></div>

<script>
// ───────────────────────── data model ─────────────────────────
const SCHEMA_VERSION = 2;
const BUILD = '2026-09-17.0208';
const FAN_TYPES = ['Stair pressurization fan','Smoke exhaust fan','Make-up air unit','RTU with smoke control','AHU with smoke control','Stair vestibule fan','Elevator pressurization fan','Smoke control damper'];
const isDamper = e => ((e && e.type) || '').toLowerCase().includes('damper');
const isFan = e => !isDamper(e);
const uid = (p='') => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);

function blankProject(name='New building'){
  return {
    id: uid('p'), schemaVersion: SCHEMA_VERSION, name, status:'active',
    created: new Date().toISOString(), updated: new Date().toISOString(),
    info:{ building:'', address:'', date: todayISO(), inspector:'', company:'Existing Building, LLC (EB Life Safety)', floorLow:1, floorHigh:'', typicalLow:'', code:'FBC §909 / NFPA 92' },
    systems:{ stair:false, vest:false, elev:false, corr:false, exhaustFireFloor:true, exhaustAbove:0, exhaustBelow:0, pressFireFloor:false, corrAbove:2, corrBelow:2, lobby:false, weekly:false, wflow:false },
    stairwells:[], hoistways:[], sequence:[], sequenceNotes:'', equipment:[], files:[],
    seqResults:{}, matrixResults:{}, zoneResults:{}, floors:{}, deficiencies:[], notes:'',
    _meta:{ source:'', sequenceFull:'', conflicts:[] },
  };
}

// Normalise any import (v1 or v2) into the v2 shape without losing data.
function normalizeProject(raw, fallbackName){
  const src = raw && raw.project ? raw.project : (raw || {});
  const p = blankProject(fallbackName || src.name || (src.info && src.info.building) || 'Imported building');
  for (const k of Object.keys(src)) if (!['id','info','systems','_meta'].includes(k)) p[k] = src[k];
  p.info = { ...p.info, ...(src.info || {}) };
  p.systems = { ...p.systems, ...(src.systems || {}) };
  p._meta = { source:'', sequenceFull:'', conflicts:[], ...(src._meta || {}) };
  if (!Array.isArray(p._meta.conflicts)) p._meta.conflicts = [];
  p._meta.conflicts = p._meta.conflicts.map((c,i) => ({ id: c.id || ('c'+i), status:'open', resolution:'', ...c }));
  for (const k of ['stairwells','hoistways','sequence','equipment','deficiencies','files']) if (!Array.isArray(p[k])) p[k] = [];
  // Attachments are references hanging off the record: drawings, firefighter's panel photos, and the
  // documents the plugin skills produce. The record itself stays the source of truth.
  p.files = p.files.map(f => ({ id: f.id || uid('f'), name:'file', kind:'other', ext:'', size:0, added: p.updated, by:'', ...f }));
  for (const k of ['seqResults','matrixResults','zoneResults','floors']) if (!p[k] || typeof p[k] !== 'object') p[k] = {};
  p.equipment = p.equipment.map(e => {
    const z = zoneInfo(e);
    return { tag:'', type:FAN_TYPES[0], location:'', zone:'', room:'', floor:'', cfm:'', cmnt:'', hasVFD:false, hasBelt:false, hasDuctDet:false, ...e,
      zone: e.zone || z.zone, room: e.room || z.room, floor: e.floor || z.floor };
  });
  p.deficiencies = p.deficiencies.map(d => ({ id: d.id || uid('d'), loc:'', sev:'Deficiency', desc:'', action:'', photos:[], ...d, photos: Array.isArray(d.photos) ? d.photos : [] }));
  p.sequence = p.sequence.map(s => ({ id: s.id || uid('s'), trigger:'', response:'', equipment:[], floors:'', notes:'', ...s }));
  // migrate index-keyed per-equipment results ("3_1") to tag keys ("SPF-1_1")
  const migrated = {};
  for (const [k,v] of Object.entries(p.seqResults)) {
    const m = /^(\d+)_(\d+)$/.exec(k);
    if (m && p.equipment[+m[1]] && p.equipment[+m[1]].tag) { const nk = p.equipment[+m[1]].tag + '_' + m[2]; if (!(nk in p.seqResults)) migrated[nk] = v; }
    else migrated[k] = v;
  }
  p.seqResults = migrated;
  p.name = p.name || p.info.building || 'Imported building';
  p.schemaVersion = SCHEMA_VERSION;
  if (!p.status) p.status = 'active';
  // Keep the record's own id. The import path reassigns it only when it would collide;
  // a pulled record MUST keep the id it has in the repository or the app cannot open it.
  if (typeof src.id === 'string' && src.id) p.id = src.id;
  if (typeof p.id !== 'string' || !p.id) p.id = uid('p');
  return p;
}

// ── attachments ──
const FILE_KINDS = [
  { id:'drawing',   label:'Mechanical drawing' },
  { id:'fscp',      label:"Firefighter's panel" },
  { id:'checklist', label:'Pretest checklist' },
  { id:'testplan',  label:'Test plan / basis of design' },
  { id:'report',    label:'Report' },
  { id:'rap',       label:'Remediation plan' },
  { id:'other',     label:'Other reference' },
];
const kindLabel = k => (FILE_KINDS.find(x => x.id === k) || FILE_KINDS.at(-1)).label;
const fileExt = name => { const m = /\.([A-Za-z0-9]{1,8})$/.exec(name || ''); return m ? m[1].toLowerCase() : ''; };
const isImageFile = f => ['jpg','jpeg','png','gif','webp','heic'].includes(f.ext || fileExt(f.name));
const isPdfFile = f => (f.ext || fileExt(f.name)) === 'pdf';
const filePath = (projectId, f) => `files/${projectId}/${f.id}${f.ext ? '.' + f.ext : ''}`;
const fileMime = f => ({ pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif', webp:'image/webp', heic:'image/heic',
  docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', json:'application/json', txt:'text/plain', csv:'text/csv' })[f.ext || fileExt(f.name)] || 'application/octet-stream';
function fmtSize(n){ n = +n || 0; return n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(0) + ' KB' : (n/1048576).toFixed(1) + ' MB'; }

// Zone parsing: explicit keys, else "Zone 11 — Ballroom (2nd Floor)"
function zoneInfo(e){
  let zone = e.zone || '', room = e.room || '', floor = e.floor || '';
  const loc = e.location || '';
  if (!zone && /^Zone\s+/i.test(loc)) {
    const rest = loc.replace(/^Zone\s+/i,'');
    const sepIdx = Math.min(...[' — ',' - ',' – '].map(s => { const i = rest.indexOf(s); return i < 0 ? 1e9 : i; }));
    if (sepIdx < 1e9) {
      zone = rest.slice(0, sepIdx).trim();
      const right = rest.slice(sepIdx).replace(/^[\s—–-]+/,'');
      const pi = right.lastIndexOf('(');
      if (pi >= 0) { if (!floor) floor = right.slice(pi+1).replace(/\)\s*$/,'').trim(); if (!room) room = right.slice(0,pi).trim(); }
      else if (!room) room = right.trim();
    } else zone = rest.trim();
  }
  return { zone, room, floor };
}
const isZoneEq = e => !!(e.zone || /^Zone\s+/i.test(e.location || ''));

// Floors: floorHigh down to floorLow, then Lobby (matches engine)
function floorLabel(f){ return f < 0 ? 'B'+Math.abs(f) : (f === 0 ? 'L' : String(f)); }
function getFloors(p){
  const hi = p.info.floorHigh; if (hi === '' || hi == null || isNaN(+hi)) return [];
  const lo = (p.info.floorLow === '' || p.info.floorLow == null) ? 1 : +p.info.floorLow;
  const out = []; for (let f = +hi; f >= lo; f--) out.push(floorLabel(f)); out.push('Lobby'); return out;
}
function floorRank(fl){ // for ordering zone floors
  const f = (fl||'').toLowerCase();
  if (!f) return 8; if (f.includes('lobby') || f.includes('ground')) return 0; if (f.includes('mezz')) return 1;
  const m = /(\d+)/.exec(f); if (m) return +m[1]; return 8;
}
function typicalLow(p){
  const t = p.info.typicalLow; if (t !== '' && t != null && !isNaN(+t)) return +t;
  const zf = p.equipment.filter(isZoneEq).map(e => floorRank(e.floor));
  const maxamen = zf.length ? Math.max(...zf) : 5;
  return Math.max(maxamen + 1, 6);
}
function typicalFloors(p){ const hi = +p.info.floorHigh; const lo = typicalLow(p); if (!hi || hi < lo) return []; const out=[]; for (let f=hi; f>=lo; f--) out.push(String(f)); return out; }
function lowerFloors(p){ const all = getFloors(p); const t = String(typicalFloors(p).slice(-1)[0] ?? ''); const idx = all.indexOf(t); return idx < 0 ? all : all.slice(idx+1); }

function getStairNames(p){ return p.systems.stair ? (p.stairwells || []) : []; }
function getHoistwayNames(p){ return p.systems.elev ? ((p.hoistways && p.hoistways.length) ? p.hoistways : ['EL']) : []; }
const hwKey = h => h.replace(/\s+/g,'_');
const hwLabel = h => { const d = h.replace(/\D/g,''); return d ? 'EL'+d : h.slice(0,4); };

// Matrix columns: building-wide fans (non-zone) + corridor + elevator + press
function getMatrixColsBase(p){
  const cols = [];
  p.equipment.filter(e => isFan(e) && !isZoneEq(e)).forEach(e => cols.push({ key:'fan_'+e.tag, label:e.tag, group:'Fans' }));
  if (p.systems.corr) { cols.push({ key:'corr_dampers', label:'Corr Dmp', group:'Corridor' }); }
  getHoistwayNames(p).forEach(h => { cols.push({ key:`elev_${hwKey(h)}_rel`, label:hwLabel(h)+' Rel', group:'Elev' }); cols.push({ key:`elev_${hwKey(h)}_lat`, label:hwLabel(h)+' Lat', group:'Elev' }); });
  if (p.systems.corr) { cols.push({ key:'press_above', label:'Press Abv', group:'Press' }); cols.push({ key:'press_below', label:'Press Blw', group:'Press' }); }
  return cols;
}
// Per-building column preferences: standard columns switched off, plus columns added on site.

  const seen = new Set();
  for (const f of list) {
    if (!f.name.endsWith('.json')) continue;
    const id = f.name.slice(0, -5); seen.add(id);
    if (S.shas[id] === f.sha && S.projects[id]) continue;          // unchanged on the server since we last saw it
    const got = await ghGetJson(`projects/${f.name}`); if (!got || !got.data || !got.data.info) continue;
    adoptRemote(id, normalizeProject({ ...got.data, id }), got.sha);
  }
  for (const id of Object.keys(S.projects)) if (!seen.has(id) && !S.dirty.has(id) && S.base[id]) { delete S.projects[id]; delete S.base[id]; delete S.shas[id]; if (S.currentId === id) { S.currentId = null; S.view = 'home'; } }
  S.lastPull = Date.now();
}
async function syncNow(force){
  if (!ghConfigured() || !S.online || S.syncing) { updateSyncBadge(); return; }
  S.syncing = true; updateSyncBadge();
  let conflicts = 0;
  try {
    if (force || Date.now() - S.lastPull > 20000 || !S.dirty.size) await pullAll();
    for (const id of [...S.dirty]) { const c = await pushOne(id); conflicts += Math.max(0, c || 0); }
    await syncPhotos();
    await syncFiles();
    S.ghOk = true; S.ghError = '';
  } catch (e) { console.warn('sync', e); S.ghOk = false; S.ghError = e.message || String(e); if (e.status === 401) toast('GitHub token rejected. Open Settings and check it.'); }
  S.syncing = false; persist(); updateSyncBadge();
  if (conflicts > 0) toast(`Merged ${conflicts} overlapping edit${conflicts>1?'s':''}; both versions kept in Sync log.`);
  if (S.dirty.size && S.online && S.ghOk) scheduleSync(8000);
  render({ keepFocus: true });
}
window.addEventListener('online', () => { S.online = true; updateSyncBadge(); scheduleSync(500); });
window.addEventListener('offline', () => { S.online = false; updateSyncBadge(); });

// ── photos (IndexedDB cache + photos/<pid>.jpg in the repo) ──
const IDB = { db: null };
function idbOpen(){ return new Promise((res, rej) => { if (IDB.db) return res(IDB.db); const r = indexedDB.open('scv5', 2); r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files'); }; r.onsuccess = () => { IDB.db = r.result; res(IDB.db); }; r.onerror = () => rej(r.error); }); }
async function idbPut(k, v, store='photos'){ try { const d = await idbOpen(); await new Promise((res,rej) => { const t = d.transaction(store,'readwrite'); t.objectStore(store).put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { console.warn('idb', e); } }
async function idbAll(store='photos'){ try { const d = await idbOpen(); return await new Promise((res,rej) => { const out = {}; const t = d.transaction(store,'readonly'); const c = t.objectStore(store).openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out[cur.key] = cur.value; cur.continue(); } else res(out); }; c.onerror = () => rej(c.error); }); } catch { return {}; } }
async function idbGet(k, store='photos'){ try { const d = await idbOpen(); return await new Promise((res,rej) => { const t = d.transaction(store,'readonly'); const q = t.objectStore(store).get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); } catch { return null; } }
async function idbDel(k, store='photos'){ try { const d = await idbOpen(); d.transaction(store,'readwrite').objectStore(store).delete(k); } catch {} }
async function loadPhotosCache(){ S.photos = await idbAll(); }
function shrinkImage(file, max=1280, q=0.72){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = rej; img.src = url;
  });
}
async function addPhoto(projectId, defId, file){
  let dataUrl = await shrinkImage(file);
  if (dataUrl.length > 400000) dataUrl = await shrinkImage(file, 1024, 0.62);
  const pid = uid('ph'); const ph = { dataUrl, caption:'', ts: new Date().toISOString(), projectId, pending: true, by: S.me || '' };
  S.photos[pid] = ph; await idbPut(pid, ph);
  updateProject(projectId, p => { const d = p.deficiencies.find(x => x.id === defId); if (d) d.photos = [...(d.photos||[]), pid]; return p; });
  return pid;
}
async function syncPhotos(){
  for (const [pid, ph] of Object.entries(S.photos)) {
    if (!ph.pending) continue;
    const path = `photos/${ph.projectId}/${pid}.jpg`, meta = `photos/${ph.projectId}/${pid}.json`;
    let sha; try { const r = await gh(repoPath(path)); if (r.status !== 404) sha = r.json.sha; } catch {}
    await ghPut(path, ph.dataUrl.split(',',2)[1], sha, `photo ${pid}`);
    let msha; try { const r = await gh(repoPath(meta)); if (r.status !== 404) msha = r.json.sha; } catch {}
    await ghPut(meta, b64enc(JSON.stringify({ caption: ph.caption || '', ts: ph.ts, by: ph.by || '' })), msha, `photo meta ${pid}`);
    ph.pending = false; await idbPut(pid, ph);
  }
}
async function fetchPhoto(projectId, pid){
  if (S.photos[pid]) return S.photos[pid];
  if (!ghConfigured() || !S.online) return null;
  try {
    const r = await gh(repoPath(`photos/${projectId}/${pid}.jpg`)); if (r.status === 404) return null;
    let content = r.json.content;
    if (!content && r.json.download_url) { const raw = await fetch(GH_API + `/repos/${S.cfg.owner}/${S.cfg.repo}/contents/photos/${projectId}/${pid}.jpg`, { headers: { 'Authorization': 'Bearer ' + S.cfg.token, 'Accept': 'application/vnd.github.raw' } }); const buf = await raw.arrayBuffer(); content = btoa(String.fromCharCode(...new Uint8Array(buf))); }
    let caption = ''; try { const m = await ghGetJson(`photos/${projectId}/${pid}.json`); if (m) caption = m.data.caption || ''; } catch {}
    const ph = { dataUrl: 'data:image/jpeg;base64,' + content.replace(/\n/g,''), caption, projectId, pending:false };
    S.photos[pid] = ph; await idbPut(pid, ph); return ph;
  } catch (e) { console.warn(e); return null; }
}
async function removePhoto(projectId, defId, pid){
  updateProject(projectId, p => { const d = p.deficiencies.find(x => x.id === defId); if (d) d.photos = (d.photos||[]).filter(x => x !== pid); return p; });
  delete S.photos[pid]; await idbDel(pid);
  if (ghConfigured() && S.online) for (const path of [`photos/${projectId}/${pid}.jpg`, `photos/${projectId}/${pid}.json`]) { try { const r = await gh(repoPath(path)); if (r.status !== 404) await ghDelete(path, r.json.sha, `remove ${pid}`); } catch {} }
}
// ── attachments (drawings, panel photos, generated documents) ──
// The bytes live at files/<record id>/<file id>.<ext> in the data repository; the record's files[]
// entry is the index. Anything opened or added on a device is kept in IndexedDB so it is there in
// airplane mode. Upload state is per device, so it is never written into the record.
const LS_FDIRTY = 'scv5_fdirty', LS_FCACHE = 'scv5_fcache';
const FILE_MAX = 25 * 1024 * 1024;
S.fdirty = new Set(lsGet(LS_FDIRTY, []));
S.fcache = new Set(lsGet(LS_FCACHE, []));
const persistFiles = () => { lsSet(LS_FDIRTY, [...S.fdirty]); lsSet(LS_FCACHE, [...S.fcache]); };
const fileCached = f => S.fcache.has(f.id);
const filePending = f => S.fdirty.has(f.id);

function readAsBase64(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',', 2)[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
}
async function addFile(projectId, file, kind){
  if (file.size > FILE_MAX) throw new Error(`${file.name} is ${fmtSize(file.size)}. The limit is 25 MB; split large drawing sets into single sheets.`);
  const ext = fileExt(file.name) || 'bin';
  const rec = { id: uid('f'), name: file.name, kind: kind || 'other', ext, size: file.size, added: new Date().toISOString(), by: S.me || '' };
  const b64 = await readAsBase64(file);
  await idbPut(rec.id, { b64, ext, name: rec.name, projectId }, 'files');
  S.fcache.add(rec.id); S.fdirty.add(rec.id); persistFiles();
  updateProject(projectId, p => { p.files = [...(p.files||[]), rec]; return p; });
  return rec;
}
async function syncFiles(){
  for (const id of [...S.fdirty]) {
    const blob = await idbGet(id, 'files'); if (!blob) { S.fdirty.delete(id); continue; }
    const f = { id, ext: blob.ext, name: blob.name };
    const path = filePath(blob.projectId, f);
    let sha; try { const r = await gh(repoPath(path)); if (r.status !== 404) sha = r.json.sha; } catch {}
    await ghPut(path, blob.b64, sha, `attachment ${blob.name}`);
    S.fdirty.delete(id); persistFiles();
  }
}
async function fetchFileData(projectId, f){
  const hit = await idbGet(f.id, 'files'); if (hit) { S.fcache.add(f.id); return hit; }
  if (!ghConfigured() || !S.online) return null;
  const r = await gh(repoPath(filePath(projectId, f))); if (r.status === 404) return null;
  let b64 = r.json.content;
  if (!b64 && r.json.git_url) { const g = await gh(r.json.git_url.replace(GH_API, '')); b64 = g.json.content; }
  const blob = { b64: (b64 || '').replace(/\n/g, ''), ext: f.ext, name: f.name, projectId };
  await idbPut(f.id, blob, 'files'); S.fcache.add(f.id); persistFiles();
  return blob;
}
function fileToBlob(f, data){
  const bin = atob(data.b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: fileMime(f) });
}
async function removeFile(projectId, f){
  updateProject(projectId, p => { p.files = (p.files||[]).filter(x => x.id !== f.id); return p; });
  await idbDel(f.id, 'files'); S.fcache.delete(f.id); S.fdirty.delete(f.id); persistFiles();
  if (ghConfigured() && S.online) { try { const path = filePath(projectId, f); const r = await gh(repoPath(path)); if (r.status !== 404) await ghDelete(path, r.json.sha, `remove ${f.name}`); } catch {} }
}
async function cacheAllFiles(projectId, onStep){
  const p = S.projects[projectId]; if (!p) return 0;
  let n = 0;
  for (const f of (p.files||[])) { if (fileCached(f)) continue; try { if (await fetchFileData(projectId, f)) n++; } catch (e) { console.warn('cache', f.name, e); } if (onStep) onStep(f); }
  persistFiles(); return n;
}

async function purgeProject(id){
  const p = S.projects[id];
  for (const f of ((p && p.files) || [])) { await idbDel(f.id, 'files'); S.fcache.delete(f.id); S.fdirty.delete(f.id); }
  persistFiles();
  delete S.projects[id]; delete S.base[id]; S.dirty.delete(id); persist();
  if (!ghConfigured() || !S.online) return;
  try {
    const r = await gh(repoPath(`projects/${id}.json`)); if (r.status !== 404) await ghDelete(`projects/${id}.json`, r.json.sha, `delete ${id}`);
    const files = await ghList(`photos/${id}`); for (const f of files) { try { await ghDelete(`photos/${id}/${f.name}`, f.sha, `delete ${id} photos`); } catch {} }
    const atts = await ghList(`files/${id}`); for (const f of atts) { try { await ghDelete(`files/${id}/${f.name}`, f.sha, `delete ${id} attachments`); } catch {} }
    delete S.shas[id]; persist();
  } catch (e) { toast('Could not delete on GitHub: ' + e.message); }
}

let toastTimer;
function toast(msg, action){
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button id="toastAct">${esc(action.label)}</button>` : '');

    const ev = el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'date' ? 'change' : 'input';
    el.addEventListener(ev, () => {
      let val = el.type === 'checkbox' ? el.checked : el.value;
      if (el.dataset.num !== undefined) val = val === '' ? '' : (isNaN(+val) ? val : +val);
      setField(S.currentId, el.dataset.path, val, { silent: el.dataset.rerender === undefined });
      if (el.dataset.rerender !== undefined) render({ keepFocus:true }); else { renderTopbar(); renderNav(); }
    });
  });
  $$('[data-pf]', root).forEach(b => b.onclick = () => { const [map, key] = b.dataset.pf.split('|'); const v = b.dataset.v; updateProject(S.currentId, p => { const cur = p[map][key] || ''; if (cur === v) delete p[map][key]; else p[map][key] = v; return p; }, { keepFocus:true }); });
  // matrix cells: one tap cycles blank -> Pass -> Fail -> N/A -> blank
  const CYC = ['', 'pass', 'fail', 'na'];
  $$('[data-cyc]', root).forEach(b => b.onclick = () => {
    const [map, key] = b.dataset.cyc.split('|');
    const cur = (S.projects[S.currentId][map] || {})[key] || '';
    const next = CYC[(CYC.indexOf(cur) + 1) % CYC.length];
    b.className = next === 'pass' ? 'p' : next === 'fail' ? 'f' : next === 'na' ? 'n' : 'e';
    b.innerHTML = next === 'pass' ? 'P' : next === 'fail' ? 'F' : next === 'na' ? 'N' : '&middot;';
    const td = b.closest('td');
    if (td) { td.classList.remove('cp','cf','cn'); if (next) td.classList.add(next === 'pass' ? 'cp' : next === 'fail' ? 'cf' : 'cn'); }
    updateProject(S.currentId, p => { if (next) p[map][key] = next; else delete p[map][key]; return p; }, { keepFocus:true });
  });
  // Matrix column preferences
  $$('[data-mxhide]', root).forEach(el => el.addEventListener('change', () => {
    const key = el.dataset.mxhide, on = el.checked;
    updateProject(S.currentId, p => { const h = new Set(p.matrixColsHide || []); if (on) h.delete(key); else h.add(key); p.matrixColsHide = [...h]; return p; });
  }));
  $$('[data-mxdel]', root).forEach(b => b.onclick = () => {
    const key = b.dataset.mxdel;
    updateProject(S.currentId, p => {
      p.matrixColsAdd = (p.matrixColsAdd || []).filter(c => c.key !== key);
      Object.keys(p.matrixResults).forEach(k => { if (k.endsWith('_' + key)) delete p.matrixResults[k]; });
      return p;
    });
    toast('Column removed');
  });
  const mxAdd = $('#mxAdd', root);
  if (mxAdd) mxAdd.onclick = () => promptBox('Add column', 'Column heading, kept short so it fits (for example Roof Hatch)', '', 'Add', label => {
    const key = colKey(label);
    if (!key) return;
    updateProject(S.currentId, p => {
      const add = (p.matrixColsAdd || []).slice();
      if (!add.some(c => c.key === key)) add.push({ key, label, group:'Added on site' });
      p.matrixColsAdd = add;
      const h = new Set(p.matrixColsHide || []); h.delete(key); p.matrixColsHide = [...h];
      return p;
    });
    toast('Added ' + label);
  });
}
function newBuilding(){ promptBox('New building', 'Building name', '', 'Create', name => { createProject(name); toast('Created ' + name); }); }

<script>
// ───────────────────────── Home ─────────────────────────
function fmtDate(iso){ if (!iso) return ''; try { return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); } catch { return ''; } }
function viewHome(){
  const all = Object.values(S.projects).filter(p => !isLane(p));      // field copies show under their building
  const active = all.filter(p => p.status === 'active'), done = all.filter(p => p.status === 'completed'), trash = all.filter(p => p.status === 'trash');
  const list = S.homeTab === 'active' ? active : S.homeTab === 'completed' ? done : trash;
  const inProg = active.filter(p => hasResults(p)).length;
  const storeNote = STORAGE_OK ? '' : `<div class="card" style="border-color:var(--fail-bd);background:var(--fail-bg)"><b>This browser is not keeping a local copy.</b> Entries reach the team database only while you have signal, and a reload during a signal gap loses unsynced entries. On iPhone, open the app in Safari directly (not inside another app) or add it to the Home Screen, then reload this page.</div>`;
  const dbNote = !ghConfigured() ? `<div class="card" style="border-color:var(--warn-bd);background:var(--warn-bg)"><b>Not connected to the team repository.</b> Buildings are saved on this device only. Open <a href="#" id="openSettings">Settings</a> and enter the repository and access token to sync with the team.</div>`
    : S.ghOk === false ? `<div class="card" style="border-color:var(--fail-bd);background:var(--fail-bg)"><b>Sync error:</b> ${esc(S.ghError)}. Entries are kept on this device and will upload once the connection works. <a href="#" id="openSettings">Settings</a></div>` : '';
  const card = p => {
    const pr = progress(p); const s = p.systems || {};
    const sysChips = [s.stair&&'Stair', s.vest&&'Vestibule', s.elev&&'Elevator', s.corr&&'Corridor', s.lobby&&'Lobby exhaust'].filter(Boolean).join(' · ');
    const dirty = S.dirty.has(p.id);
    return `<div class="bcard">
      <div><h3>${esc(p.name || 'Untitled')}</h3><div class="addr">${esc(p.info.address || 'No address yet')}</div></div>
      <div class="meta"><span>Test ${esc(fmtDate(p.info.date) || 'not set')}</span><span>Levels ${esc(p.info.floorLow)}–${esc(p.info.floorHigh || '?')}</span><span>${p.equipment.length} devices</span>${dirty ? '<span class="flag">unsynced</span>' : ''}</div>
      <div class="small muted">${esc(sysChips || 'No systems selected')}</div>
      ${laneStrip(p)}
      <div><div class="prog"><i style="width:${pr.pct}%"></i></div><div class="small faint mono" style="margin-top:3px">${pr.done}/${pr.total} results · ${p.deficiencies.length} deficienc${p.deficiencies.length===1?'y':'ies'}${pr.fails?` · <span class="flag">${pr.fails} fail</span>`:''}</div></div>
      <div class="acts">
        ${p.status === 'trash' ? `<button class="btn-sm" data-act="restore" data-id="${p.id}">Restore</button><button class="btn-sm btn-danger" data-act="purge" data-id="${p.id}">Delete forever</button>`
        : p.status === 'completed' ? `<button class="btn-sm btn-primary" data-act="open" data-id="${p.id}">Open</button><button class="btn-sm" data-act="reactivate" data-id="${p.id}">Back to active</button><button class="btn-sm" data-act="export" data-id="${p.id}">Export JSON</button>`
        : `<button class="btn-sm btn-primary" data-act="open" data-id="${p.id}">Open</button><button class="btn-sm" data-act="lane" data-id="${p.id}">Work as my own copy</button>${lanesOf(p.id).length ? `<button class="btn-sm" data-act="merge" data-id="${p.id}">Merge copies (${lanesOf(p.id).length})</button>` : ''}<button class="btn-sm" data-act="rename" data-id="${p.id}">Rename</button><button class="btn-sm" data-act="export" data-id="${p.id}">Export JSON</button><button class="btn-sm" data-act="complete" data-id="${p.id}">Mark complete</button><button class="btn-sm btn-ghost" data-act="trash" data-id="${p.id}" title="Move to trash">Trash</button>`}
      </div></div>`;
  };
  return `<div class="hero"><div><h2>Buildings</h2><p>${active.length} active · ${inProg} with results entered · ${done.length} completed</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label class="small muted" for="meName">Inspector</label><input id="meName" value="${esc(S.me)}" placeholder="Your name" style="width:160px;padding:6px 8px"><button id="btnImport">Import JSON</button><button class="btn-primary" id="btnNew">+ New building</button></div></div>
    ${storeNote}${dbNote}
    <div class="dtabs"><button data-ht="active" class="${S.homeTab==='active'?'on':''}">Active (${active.length})</button><button data-ht="completed" class="${S.homeTab==='completed'?'on':''}">Completed (${done.length})</button><button data-ht="trash" class="${S.homeTab==='trash'?'on':''}">Trash (${trash.length})</button></div>
    ${list.length ? `<div class="bcards">${list.sort((a,b) => (b.updated||'').localeCompare(a.updated||'')).map(card).join('')}</div>` : `<div class="empty">${S.homeTab === 'active' ? 'No active buildings. Create one or import a SC Inspect JSON.' : 'Nothing here.'}</div>`}`;
}
function bindHome(root){
  $$('[data-ht]', root).forEach(b => b.onclick = () => { S.homeTab = b.dataset.ht; render(); });
  $('#btnNew', root).onclick = newBuilding; $('#btnImport', root).onclick = importDialog;
  $('#meName', root).onchange = e => { S.me = e.target.value.trim(); lsSet(LS.me, S.me); };
  const os = $('#openSettings', root); if (os) os.onclick = e => { e.preventDefault(); settingsDialog(); };
  $$('[data-act]', root).forEach(b => b.onclick = () => {
    const id = b.dataset.id, p = S.projects[id]; const act = b.dataset.act;
    if (act === 'open') go('setup', id);
    else if (act === 'lane') promptBox('Work as your own copy', 'Whose copy is this?', S.me || '', 'Create', who => { const c = createLane(id, who); if (c) { if (!S.me) { S.me = who; lsSet(LS.me, who); } toast(`Created ${c.name}. Everything you enter stays in this copy until it is merged.`); go('setup', c.id); } });
    else if (act === 'merge') mergeDialog(id);
    else if (act === 'rename') promptBox('Rename building', 'Name', p.name, 'Save', v => updateProject(id, x => { x.name = v; if (!x.info.building) x.info.building = v; return x; }));
    else if (act === 'export') exportProject(p);
    else if (act === 'complete') updateProject(id, x => { x.status = 'completed'; x.completedAt = new Date().toISOString(); return x; });
    else if (act === 'reactivate') updateProject(id, x => { x.status = 'active'; return x; });
    else if (act === 'trash') { updateProject(id, x => { x.status = 'trash'; x.deletedAt = new Date().toISOString(); return x; }); toast('Moved to Trash', { label:'Undo', fn: () => updateProject(id, x => { x.status = 'active'; return x; }) }); }
    else if (act === 'restore') updateProject(id, x => { x.status = 'active'; return x; });
    else if (act === 'purge') confirmBox('Delete forever?', `<b>${esc(p.name)}</b> and its photos will be removed for everyone. This cannot be undone.`, 'Delete forever', async () => { await purgeProject(id); render(); }, true);
  });
}
function importDialog(){
  modal(`<h3>Import a SC Inspect JSON</h3><p class="hint">Paste an export (from this app, the old Replit app, or the intake skill) or choose a file. It is added as a new building; nothing existing is overwritten.</p>
    <textarea id="impText" style="min-height:140px;font-family:var(--font-mono);font-size:11.5px" placeholder='{"info": {...}, "equipment": [...]}'></textarea>
    <div style="margin-top:8px"><input type="file" id="impFile" accept="application/json,.json"></div><div class="acts"><button id="mCancel">Cancel</button><button id="mOk" class="btn-primary">Import</button></div>`, () => {
    $('#mCancel').onclick = closeModal;
    $('#impFile').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { $('#impText').value = t; }); };
    $('#mOk').onclick = () => { try { const p = importProjectText($('#impText').value); closeModal(); toast(`Imported ${p.name} (${p.equipment.length} devices)`); } catch (e) { toast(e.message); } };
  });
}
async function collectPhotos(p){
  const photos = {};
  for (const d of p.deficiencies) for (const pid of (d.photos||[])) { const ph = await fetchPhoto(p.id, pid); if (ph) photos[pid] = { dataUrl: ph.dataUrl, caption: ph.caption||'', ts: ph.ts }; }
  return photos;
}
const exportName = p => (p.name || 'project').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_') + '_SC_Inspect.json';
async function exportProject(p, withPhotos){
  const text = exportJSON(p, withPhotos ? await collectPhotos(p) : {});
  const fname = exportName(p);
  try { const blob = new Blob([text], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); toast('Saved ' + fname); return; } catch {}
  try { await navigator.clipboard.writeText(text); toast('JSON copied to clipboard'); } catch { modal(`<h3>Export</h3><textarea style="min-height:260px;font-family:var(--font-mono);font-size:11px">${esc(text)}</textarea><div class="acts"><button id="mCancel">Close</button></div>`, () => $('#mCancel').onclick = closeModal); }
}
// Hand the record to Claude from a phone: copy the prompt, then open the share sheet with the file.
const canShareFiles = () => { try { return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [new File(['{}'], 'x.json', { type:'application/json' })] })); } catch { return false; } }
async function sendToClaude(p, prompt, withPhotos){
  const text = exportJSON(p, withPhotos ? await collectPhotos(p) : {});
  const file = new File([text], exportName(p), { type:'application/json' });
  let copied = false;
  try { await navigator.clipboard.writeText(prompt); copied = true; } catch {}
  if (canShareFiles()) {
    try { await navigator.share({ files: [file], title: p.name }); toast(copied ? 'Prompt copied. In Claude, paste it and send with the attached file.' : 'File shared. Copy the prompt from the card and paste it in Claude.'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  await exportProject(p, withPhotos);
  toast(copied ? 'File saved and prompt copied. Attach the file in Claude and paste the prompt.' : 'File saved. Attach it in Claude with the prompt from the card.');
}

function stepper(path, val){ return `<div class="stepper"><button data-step="${path}" data-d="-1">−</button><span>${val}</span><button data-step="${path}" data-d="1">+</button></div>`; }
function chips(list, kind){ return `<div class="chips">${list.map((n,i) => `<span class="chip">${esc(n)}<button data-rm="${kind}" data-i="${i}" title="Remove">×</button></span>`).join('')}</div><div style="display:flex;gap:6px"><input id="add_${kind}" placeholder="${kind==='stairwells'?'e.g. Stair A, Stair 2B':'e.g. EL-1, Service'}" style="font-size:13px"><button data-add="${kind}" style="white-space:nowrap">+ Add</button></div>`; }

  const seqGrid = `<div class="row2" style="padding:8px 0 4px">
      <div><div class="lbl">Exhaust</div><div class="tog-row"><span class="small">Fire floor</span>${switchEl(s.exhaustFireFloor !== false, 'data-path="systems.exhaustFireFloor" data-rerender')}</div><div class="tog-row"><span class="small">Floors above</span>${stepper('systems.exhaustAbove', s.exhaustAbove||0)}</div><div class="tog-row"><span class="small">Floors below</span>${stepper('systems.exhaustBelow', s.exhaustBelow||0)}</div></div>
      <div><div class="lbl">Pressurization</div><div class="tog-row"><span class="small">Fire floor</span>${switchEl(!!s.pressFireFloor, 'data-path="systems.pressFireFloor" data-rerender')}</div><div class="tog-row"><span class="small">Floors above</span>${stepper('systems.corrAbove', s.corrAbove||0)}</div><div class="tog-row"><span class="small">Floors below</span>${stepper('systems.corrBelow', s.corrBelow||0)}</div></div></div>`;
  const systems = `${tog('stair','Stair pressurization')}${s.stair ? `<div style="padding:4px 0 8px 8px"><div class="lbl">Stairwells (${p.stairwells.length})</div>${chips(p.stairwells,'stairwells')}</div>` : ''}
    ${tog('vest','Stair vestibule pressurization')}${tog('elev','Elevator hoistway pressurization')}${s.elev ? `<div style="padding:4px 0 8px 8px"><div class="lbl">Hoistways (${p.hoistways.length})</div>${chips(p.hoistways,'hoistways')}</div>` : ''}

  const sequence = `<p class="hint">One row per initiating condition, in the order the system responds. This prints as Section 4 (Sequence of Operations) in the test plan and results report; leave it empty to use the generic wording derived from the system toggles above. Treat it as design intent until field-confirmed.</p>
    ${seqRows}<button style="margin-top:8px" id="seqAdd">+ Add condition</button>

    ${p._meta.sequenceFull ? `<details><summary class="small muted" style="cursor:pointer">Sequence narrative from source documents</summary><pre class="prompt" style="margin-top:6px">${esc(p._meta.sequenceFull)}</pre></details>` : ''}`;

function bindSetup(root, p){

<script>
// ───────────────────────── Equipment ─────────────────────────
function viewEquip(p){
  const zones = getZones(p);
  const rows = p.equipment.map((e,i) => {
    const flags = [e.hasVFD && '<span class="badge b-info">VFD</span>', e.hasBelt && '<span class="badge b-obs">Belt</span>', e.hasDuctDet && '<span class="badge b-def">Duct det.</span>', e.cfm && `<span class="badge b-note">${esc(e.cfm)} CFM</span>`].filter(Boolean).join(' ');

    return `<div class="card" style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">

}
function equipForm(p, idx){

    <div class="row2"><div class="field"><label class="lbl" for="q_loc">Location / serves</label><input id="q_loc" value="${esc(e.location)}" placeholder="Roof mech. room / Stair 2A"></div><div class="field"><label class="lbl" for="q_cfm">Design CFM</label><input id="q_cfm" value="${esc(e.cfm)}" placeholder="optional"></div></div>
    <div class="lbl" style="margin-top:4px">Lower-level zone (leave blank for building-wide equipment)</div>

function bindEquip(root, p){

// ───────────────────────── Sequence tests ─────────────────────────
function rr(name, ev, exp, val, pfAttr){ return `<div class="rr"><div class="rr-info"><div class="rr-name">${name}</div>${ev ? `<div class="rr-ev">${ev}</div>` : ''}${exp ? `<div class="rr-exp">${exp}</div>` : ''}</div>${pfn(val, pfAttr)}</div>`; }
const seqOpen = lsGet('scv5_seqopen', {});

function bindSeq(root, p){
  $$('[data-eqtog]', root).forEach(b => b.onclick = () => {

function viewSeq(p){
  let pass = 0, fail = 0;

  // the field you work one device at a time.
  const q = (S.seqFilter || '').trim().toLowerCase();

  const shown = p.equipment.filter(match);

    const tests = getSeqTests(e);

    const done = vals.filter(Boolean).length, f = vals.filter(v => v === 'fail').length;
    const state = f ? 'fail' : done === 0 ? '' : done < tests.length ? 'part' : 'pass';
    const label = f ? `${f} fail` : done === 0 ? 'not started' : done < tests.length ? `${done}/${tests.length}` : 'complete';
    const open = !!seqOpen[e.tag];
    return `<div class="eqa${open?' on':''}" data-eqa="${esc(e.tag)}">
      <button class="eqa-h" data-eqtog="${esc(e.tag)}">
        <span class="tag">${esc(e.tag)}</span>
        <span class="small faint eqa-sub">${esc(e.type)}${e.location ? ' · ' + esc(e.location) : ''}</span>
        <span class="eqa-st ${state}">${esc(label)}</span>
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="eqa-b">${tests.map((t,ti) => rr(esc(t.action), esc(t.event), esc(t.exp), vals[ti], `data-pf="seqResults|${esc(seqKey(e,ti))}"`)).join('')}</div>
    </div>`;
  }).join('') : `<div class="empty">No device matches "${esc(S.seqFilter)}".</div>`) : '<div class="empty">Add equipment first.</div>';
  const eqTools = p.equipment.length ? `<div class="rowflex" style="margin-bottom:10px">

      <span class="small faint">${shown.length} of ${p.equipment.length}</span></div>` : '';
  const stats = (pass+fail) ? `<div class="stats"><div class="stat pass"><b>${pass}</b><span>Pass</span></div><div class="stat ${fail?'fail':'pass'}"><b>${fail}</b><span>Fail</span></div></div>` : '';

  return sec('q_eq', 'Equipment panel tests (Appendix A-1)', stats + eqTools + eqCards)
    + sec('q_fault', 'Fault conditions', FAULT_TESTS.map(f => rr(esc(f.lbl), f.id === 'f3' && !p.systems.weekly ? 'N/A, not required per AHJ' : esc(f.ev), '', p.seqResults[f.id]||'', `data-pf="seqResults|${f.id}"`)).join(''), { open:false })
    + sec('q_ep', 'Emergency power', EMERG_TESTS.map(f => rr(esc(f.lbl), esc(f.ev), '', p.seqResults[f.id]||'', `data-pf="seqResults|${f.id}"`)).join(''), { open:false })
    + sec('q_init', 'Initiating devices', INIT_TESTS.map(f => rr(esc(f.lbl), f.id === 'i2' && !p.systems.wflow ? 'Not tested / deferred to annual inspections' : esc(f.ev), '', p.seqResults[f.id]||'', `data-pf="seqResults|${f.id}"`)).join(''), { open:false })
    + sec('q_vis', 'Visual inspection (Table 1)', Object.entries(cats).map(([c, items]) => `<div class="lbl" style="margin-top:10px">${esc(c)}</div>${items.map(v => rr(esc(v.lbl), '', '', p.seqResults[v.id]||'', `data-pf="seqResults|${v.id}"`)).join('')}`).join(''), { open:false });

// ───────────────────────── Floor matrix ─────────────────────────
function matrixTable(p, floors, cols, title){

}
function viewMatrix(p){

  const tlo = typicalLow(p);

  const bRows = low.length ? `<p class="hint">Building-wide systems on the lower levels (corridor dampers, stair fans, elevator recall). Zone-specific purge and isolation for these floors is recorded under Lower-level zones.</p>${matrixTable(p, low, cols, 'Level')}` : '<div class="empty">No lower-level floors in range.</div>';

// ───────────────────────── Lower-level zones ─────────────────────────
function viewZones(p){

}

</script>
<script>
// ───────────────────────── Pressure & door force ─────────────────────────
function pInput(prefix, fl, field, val, step){ const bad = pressFlag(field, val); return `<input type="number" step="${step}" placeholder="—" data-k="fl.${esc(prefix)}.${esc(fl)}.${field}" data-press="${esc(prefix)}|${esc(fl)}|${field}" value="${esc(val)}" class="${bad?'bad':''}" title="${bad ? (field==='dp' ? 'Below 0.05 in. w.g. minimum' : 'Above 30 lbf maximum') : ''}">`; }
function clBtn(prefix, fl, val){ return `<button class="cl-btn ${val||''}" data-cl="${esc(prefix)}|${esc(fl)}">${val === 'pass' ? 'LATCH OK' : val === 'fail' ? 'NO LATCH' : '— latch —'}</button>`; }
const BLK_HINT = { stair:'Stair to corridor, door force at the stair door', stairv:'Stair to vestibule, door force at the stair door', vest:'Vestibule to corridor, door force at the vestibule door', elev:'Lobby ΔP and door forces', corr:'Corridor to unit, sample basis' };
function blkHint(blk){ return BLK_HINT[blk.kind] || ''; }
function pressByShaft(p, floors, blk){

  const heads = blk.cl ? ['Floor','ΔP in. w.g.','Break lb','Swing lb','Close / latch'] : ['Floor','ΔP in. w.g.','Break lb','Swing lb'];
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span class="tag" style="font-size:14px">${esc(blk.label)}</span><span class="small faint">${blkHint(blk)}</span></div>
    <div class="pgrid${blk.cl?"":" noc"}" style="grid-template-columns:${cols}">${heads.map(h => `<div class="ph">${h}</div>`).join('')}</div>
    ${floors.map(fl => { const d = p.floors[`${blk.prefix}_${fl}`] || {}; return `<div class="pgrid${blk.cl?"":" noc"}" style="grid-template-columns:${cols}"><div class="pf">${esc(fl)}</div>${pInput(blk.prefix, fl, 'dp', d.dp ?? '', '0.001')}${pInput(blk.prefix, fl, 'brk', d.brk ?? '', '0.5')}${pInput(blk.prefix, fl, 'swg', d.swg ?? '', '0.5')}${blk.cl ? clBtn(blk.prefix, fl, d.cl || '') : ''}</div>`; }).join('')}</div>`;
}

  return `<div class="card"><div class="tag" style="font-size:14px;margin-bottom:8px">Level ${esc(fl)}</div>
    <div class="prow"><div class="ph">Shaft / door</div><div class="pin"><div class="ph">ΔP in. w.g.</div><div class="ph">Break lb</div><div class="ph">Swing lb</div><div class="ph">Close / latch</div></div></div>
    ${blocks.map(blk => { const d = p.floors[`${blk.prefix}_${fl}`] || {}; return `<div class="prow"><div class="pf" title="${esc(blk.label)}">${esc(blk.short || blk.label)}</div><div class="pin${blk.cl?'':' noc'}">${pInput(blk.prefix, fl, 'dp', d.dp ?? '', '0.001')}${pInput(blk.prefix, fl, 'brk', d.brk ?? '', '0.5')}${pInput(blk.prefix, fl, 'swg', d.swg ?? '', '0.5')}${blk.cl ? clBtn(blk.prefix, fl, d.cl || '') : ''}</div></div>`; }).join('')}</div>`;
}
function viewPress(p){
  const floors = getFloors(p); const blocks = pressBlocks(p);
  if (!floors.length) return sec('p_a', 'Pressure differential & door force (A-2b)', '<div class="empty">Set the highest floor in Setup first.</div>');
  if (!blocks.length) return sec('p_a', 'Pressure differential & door force (A-2b)', '<div class="empty">Enable stair, elevator or corridor systems in Setup and name the stairwells / hoistways.</div>');
  let low = 0, high = 0, n = 0; for (const [k, d] of Object.entries(p.floors)) { if (d.dp !== '' && d.dp != null) { n++; if (+d.dp < DP_MIN) low++; } if (pressFlag('brk', d.brk) || pressFlag('swg', d.swg)) high++; }
  const stats = `<div class="stats"><div class="stat"><b>${n}</b><span>ΔP readings</span></div><div class="stat ${low?'fail':'pass'}"><b>${low}</b><span>Below 0.05</span></div><div class="stat ${high?'fail':'pass'}"><b>${high}</b><span>Force over 30 lbf</span></div></div>`;
  const mode = `<div class="subtabs"><button data-pm="shaft" class="${S.pressMode==='shaft'?'on':''}">By shaft (all levels)</button><button data-pm="floor" class="${S.pressMode==='floor'?'on':''}">By floor (all shafts)</button></div>`;
  let body;

  } else {

      <div style="display:flex;gap:6px;margin-top:6px"><button data-pnav="-1" ${sub===0?'disabled':''}>↑ ${esc(floors[sub-1] ?? '')}</button><button data-pnav="1" ${sub===floors.length-1?'disabled':''}>↓ ${esc(floors[sub+1] ?? '')}</button></div>`;
  }
  return sec('p_a', 'Pressure differential & door force (A-2b)', `${stats}<p class="hint">Minimum ΔP 0.05 in. w.g.; maximum door force 30 lbf (NFPA 92 §6.4.2). Out-of-range values are outlined in red. Both entry modes write the same record.${p.systems.vest ? ' With vestibule pressurization enabled, each stair is measured at both doors: the stair door and the vestibule door.' : ''}</p>${mode}${body}`);
}
function bindPress(root){

const RULES = `You are the field assistant inside SC Inspect, EB Life Safety's smoke control inspection record. Answer briefly and plainly for an inspector on site. Use the tools to change the record only when the inspector clearly asks for a change; confirm exactly what you changed (tag, test, floor, value). Result values are pass, fail, na or empty. When something is ambiguous (which stair, which floor), ask one short question instead of guessing. Never invent results. When the inspector asks what a drawing, schedule, panel photo, remediation plan or prior report says, read it with read_document or read_sheet and answer from the document; do not answer from the record or from memory of how these buildings usually work, and say so if it is not attached. Intake questions in the brief are background from before the inspection: use them to explain what to look at, never as a checklist to work through, and never repeat them unasked. Do not use em dashes.`;

  home:'Building list', setup:'Building setup', equip:'Equipment list',

// How an inspection is run. The assistant coaches from this: the next step for where the
// inspector is standing, not the whole procedure at once.
const PROCEDURE = `HOW AN INSPECTION IS RUN

The inspector's current screen is named with the record. When asked what to do next, or what a
table is for, answer with the procedure for that screen and keep it to the next step or two.

GENERAL
Testing is done with the fire alarm technician and the building engineer present. Work one item at
a time and record the result before moving on. Record what was observed, not what should happen.
Reset the fire alarm panel between scenarios and confirm fans and dampers return to normal before
initiating the next device.

EQUIPMENT TESTS, PER DEVICE (Appendix A-1)
Take each device through its test items in order with the fire alarm technician.
Manual override: the fire alarm technician places the FSCP switch in the commanded position, the
technician confirms the fan responds, and records that the panel status matches the actual fan
state, through ON, OFF and back to AUTO.
Power loss: open the disconnect and confirm the panel annunciates a trouble or fault for that device.
Where a device has a VFD, record the drive settings and the speed it runs at in smoke control mode.
Where it is belt driven, confirm 1.5 times the number of belts. Where a duct detector serves it,
confirm it reports at the panel.
A fan commanded on must prove it is running by pressure difference or airflow switch, and the panel
must show it.

FLOOR MATRIX (A-2)
Each row is the building's response to a smoke detector activation on that floor, so initiate one
floor at a time. Every column is checked on each floor: each piece of equipment listed shall
activate on alarm. Where pressurization above and below is provided, confirm the fans and the
associated pressurization or exhaust dampers on the floor above and the floor below operate and
deliver airflow to those floors. Dampers on floors outside the response shall close. Reset the panel
before initiating the next floor.

PRESSURE AND DOOR FORCE (A-2b)
Activate the stair and elevator fans, then record the pressure differential and door forces at each
door on each floor. Minimum 0.05 in. w.g., maximum door opening force 30 lbf, or 15 lbf where
accessibility requirements apply. With a vestibule, both doors in series are measured, the stair
door and the vestibule door. Where the system exhausts the fire floor, record that floor with the
system in alarm, then reset and move to the next floor. Record closing and latching at each level.

DEFICIENCIES (Appendix C)
Give the location by floor and area, describe the observed condition, and state what needs to
happen. Photograph anything recorded as a deficiency.`;
function chatTools(){

function findAttachment(p, q){

    || files.find(x => x.name.toLowerCase() === s)
    || files.find(x => x.name.toLowerCase().includes(s))
    || files.find(x => s.includes(x.name.toLowerCase()));
  if (!f) throw new Error(files.length ? 'No such document. Attached: ' + files.map(x => x.name).join('; ') : 'Nothing is attached to this building yet');
