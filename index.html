const QUICK = ['How do I run this one?', 'What is still open?', 'Summarise the fails', 'Any pressure readings out of range?', 'What did I record on this floor?'];
function chatRender(){
  const log = $('#chatLog'); if (!log) return;
  const intro = `<div class="msg a">Tell me what to record, or ask about this building. For example: "mark SPF-3 belt-off as fail", "corridor dampers pass on levels 20 to 30", "Stair A level 12: dp 0.08, break 22, swing 14, latched", "add a deficiency: level 9 west elevator lobby door does not latch".</div>`;
  log.innerHTML = (S.chat.length ? S.chat.map(m => `<div class="msg ${m.role === 'user' ? 'u' : m.role === 'tool' ? 't' : 'a'}">${esc(m.content)}</div>`).join('') : intro)
    + (S.chat.length ? '' : `<div class="quick">${QUICK.map(q => `<button class="btn-sm" data-quick="${esc(q)}">${esc(q)}</button>`).join('')}</div>`);
  $$('[data-quick]', log).forEach(b => b.onclick = () => { $('#chatText').value = b.dataset.quick; chatSend(); });

}
const CHAT_KEY = 'scv5_chat_';
function chatLoad(id){ try { return JSON.parse(localStorage.getItem(CHAT_KEY + id) || '[]'); } catch { return []; } }
function chatSave(id, msgs){ try { localStorage.setItem(CHAT_KEY + id, JSON.stringify(msgs.slice(-40))); } catch {} }
function apiError(e){
  const m = (e && e.message || '').toLowerCase();
  if (e && e.name === 'AbortError') return 'Stopped.';
  if (e && e.status === 401) return 'The Anthropic API key was rejected. Check it in Settings.';
  if (e && e.status === 429) return 'Rate limited by the API. Wait a few seconds and try again.';
  if (m.includes('credit') || m.includes('billing')) return 'The Anthropic account is out of credit. Top it up in the console, then try again.';
  if (e && e.status >= 500) return 'The API had a problem. Try again in a moment.';
  if (m.includes('failed to fetch') || m.includes('networkerror')) return 'No connection to the API. This needs signal; your entries are saved either way.';
  return 'Could not get an answer: ' + (e && e.message || e);
}
async function anthropicCall(messages, tools, signal, onText){
  const body = { model: S.cfg.model || 'claude-sonnet-4-5', max_tokens: 1500, system: RULES + '\n\n' + PROCEDURE, messages, tools: tools.map(t => ({ name: t.name, description: t.description, input_schema: t.inputSchema || { type:'object', properties:{} } })) };
  const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', signal, headers: { 'content-type':'application/json', 'x-api-key': S.cfg.anthropicKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { const e = new Error((j.error && j.error.message) || ('API ' + r.status)); e.status = r.status; throw e; }
  return j;
}
async function chatSend(){
  const box = $('#chatText'); const text = box.value.trim(); if (!text || S.chatBusy) return; const p = cur(); if (!p) return;
  if (!S.online) { toast('Chat needs a connection.'); return; }
  if (!S.cfg.anthropicKey) { toast('Add your Anthropic API key in Settings to use chat.'); settingsDialog(); return; }
  if (recOn) { try { REC.stop(); } catch {} }
  box.value = ''; S.chat.push({ role:'user', content:text }); S.chatBusy = true; chatRender();
  const bubble = { role:'assistant', content:'Thinking…' }; S.chat.push(bubble); chatRender();
  S.chatCtl = new AbortController();
  const hist = S.chat.filter(m => m.role !== 'tool' && m !== bubble).slice(-12).map(m => ({ role: m.role, content: m.content }));
  const messages = [{ role:'user', content: 'CURRENT RECORD\n' + projectBrief(p) + '\n\nCURRENT SCREEN: ' + (SCREENS[S.view] || S.view) }, { role:'assistant', content:'Understood. I have the record and I can see which screen you are on.' }, ...hist];
  const tools = chatTools();
  try {
    for (let round = 0; round < 6; round++) {
      const resp = await anthropicCall(messages, tools, S.chatCtl.signal);
      const textParts = resp.content.filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
      const uses = resp.content.filter(c => c.type === 'tool_use');
      if (textParts) { bubble.content = textParts; chatRender(); }
      if (!uses.length || resp.stop_reason !== 'tool_use') break;
      messages.push({ role:'assistant', content: resp.content });
      const results = [];
      for (const u of uses) {
        const t = tools.find(x => x.name === u.name); let out;
        try { out = await t.execute(u.input || {}, { signal: S.chatCtl.signal }); S.chat.splice(S.chat.indexOf(bubble), 0, { role:'tool', content:'✓ ' + out }); }
        catch (e) { out = 'Error: ' + (e.message || e); S.chat.splice(S.chat.indexOf(bubble), 0, { role:'tool', content:'✗ ' + out }); }
        chatRender();
        results.push({ type:'tool_result', tool_use_id: u.id, content: typeof out === 'string' ? out : JSON.stringify(out) });
      }
      messages.push({ role:'user', content: results });
      bubble.content = 'Working…'; chatRender();
    }
    if (bubble.content === 'Working…' || bubble.content === 'Thinking…') bubble.content = 'Done.';
  } catch (e) { bubble.content = apiError(e); }
  S.chatBusy = false; chatRender(); chatSave(p.id, S.chat);
}
// Dictation, for when both hands are busy. iOS Safari exposes webkitSpeechRecognition.
let REC = null, recOn = false;
function micSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function micToggle(){
  if (!micSupported()) return;
  const btn = $('#chatMic');
  if (recOn) { try { REC.stop(); } catch {} return; }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  REC = new R(); REC.lang = 'en-US'; REC.interimResults = true; REC.continuous = false;
  const box = $('#chatText'); const base = box.value ? box.value + ' ' : '';
  REC.onstart = () => { recOn = true; btn.classList.add('rec'); btn.title = 'Stop dictation'; };
  REC.onresult = e => { let t = ''; for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript; box.value = base + t; };
  REC.onerror = e => { toast(e.error === 'not-allowed' ? 'Microphone access was refused.' : 'Dictation stopped.'); };
  REC.onend = () => { recOn = false; btn.classList.remove('rec'); btn.title = 'Dictate'; box.focus(); };
  try { REC.start(); } catch { toast('Dictation is not available here.'); }
}
function chatInit(){
  $('#chatFab').onclick = () => { const p = cur(); if (p) S.chat = chatLoad(p.id); $('#chat').classList.add('open'); chatRender(); if (!/Mobi/i.test(navigator.userAgent)) $('#chatText').focus(); };

  $('#chatClear').onclick = () => { S.chat = []; const p = cur(); if (p) chatSave(p.id, []); chatRender(); };
  $('#chatSend').onclick = chatSend;
  $('#chatMic').hidden = !micSupported();
  $('#chatMic').onclick = micToggle;
  $('#chatText').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatSend(); } };
}

      <dt>Floors</dt><dd>${esc(i.floorLow)} to ${esc(i.floorHigh || '?')}</dd><dt>Prepared</dt><dd>${esc(fmtLong(new Date().toISOString().slice(0,10)))}</dd></dl>`;
}
const DISCLAIMER = `<div class="note"><b>Field summary.</b> This sheet is generated on site from the inspection record for coordination. It is not the sealed Smoke Control Inspection Test Results Report, which is issued separately by Existing Building, LLC (EB Life Safety).</div>`;

function photoFigures(pids){
  const out = [];
  for (const pid of pids || []) { const ph = S.photos[pid]; if (ph && ph.dataUrl) out.push(`<figure><img src="${ph.dataUrl}" alt=""><figcaption>${esc(ph.caption || '')}</figcaption></figure>`); }
  return out.length ? `<div class="ph">${out.join('')}</div>` : '';
}

function deficiencyDoc(p){
  const ds = p.deficiencies || [];
  const bySev = s => ds.filter(d => d.sev === s);
  const rows = ds.map((d,i) => `<div class="item"><table><tr><th style="width:26px">#</th><th style="width:130px">Location</th><th style="width:78px">Classification</th><th>Observed condition</th><th>Required corrective action</th></tr>
    <tr><td class="c">${i+1}</td><td>${esc(d.loc || '')}</td><td><span class="pill p-${d.sev === 'Deficiency' ? 'def' : d.sev === 'Observation' ? 'obs' : 'note'}">${esc(d.sev)}</span></td><td>${esc(d.desc)}</td><td>${esc(d.action || '')}</td></tr></table>${photoFigures(d.photos)}</div>`).join('');
  return `${docHeader(p, 'Smoke Control Inspection: Deficiency List')}
    ${DISCLAIMER}
    <h2>Summary</h2>
    <table><tr><th>Deficiencies</th><th>Observations</th><th>Notes</th><th>Total items</th></tr>
      <tr><td class="c">${bySev('Deficiency').length}</td><td class="c">${bySev('Observation').length}</td><td class="c">${bySev('Note').length}</td><td class="c">${ds.length}</td></tr></table>
    <h2>Items</h2>
    ${rows || '<p>No deficiencies, observations or notes were recorded.</p>'}
    ${p.notes ? `<h2>General notes</h2><p>${esc(p.notes).replace(/\n/g,'<br>')}</p>` : ''}
    <div class="foot">${esc(p.info.company || 'Existing Building, LLC')} · ${esc(p.name)} · generated ${new Date().toLocaleString()}</div>`;
}

function summaryDoc(p){
  const pr = progress(p);
  const sys = [p.systems.stair && 'stair pressurization', p.systems.vest && 'vestibule pressurization', p.systems.elev && 'elevator hoistway pressurization', p.systems.corr && 'corridor smoke control', p.systems.lobby && 'lobby / amenity exhaust'].filter(Boolean).join(', ');
  // per-device results
  const eqRows = p.equipment.map(e => {
    const tests = getSeqTests(e); const vals = tests.map((t,ti) => seqGet(p,e,ti));
    const fails = tests.filter((t,ti) => vals[ti] === 'fail').map(t => t.action);
    const done = vals.filter(Boolean).length;
    const status = fails.length ? `<span class="fail">Fail</span>` : done === 0 ? '<span class="na">Not tested</span>' : done < tests.length ? '<span class="na">Partial</span>' : '<span class="pass">Pass</span>';
    return `<tr><td>${esc(e.tag)}</td><td>${esc(e.type)}</td><td>${esc(e.location || '')}</td><td class="c">${done}/${tests.length}</td><td class="c">${status}</td><td>${esc(fails.join('; '))}</td></tr>`;
  }).join('');
  // visual + table 2
  const vis = [...VISUAL_ITEMS, ...FAULT_TESTS, ...EMERG_TESTS, ...INIT_TESTS];
  const visFails = vis.filter(v => p.seqResults[v.id] === 'fail');
  // zones
  const zones = getZones(p);
  const zoneRows = zones.map(z => `<tr><td>${esc(z.zone)}</td><td>${esc(z.room || '')}</td><td>${esc(z.floor || '')}</td><td class="c">${rvCell(p.zoneResults[z.zone+'_fans'])}</td><td class="c">${rvCell(p.zoneResults[z.zone+'_dampers'])}</td><td class="c">${rvCell(p.zoneResults[z.zone+'_isolate'])}</td><td>${esc(p.zoneResults[z.zone+'_note'] || '')}</td></tr>`).join('');
  // matrix failures only (a full matrix is for the sealed report)
  const mFails = Object.entries(p.matrixResults).filter(([,v]) => v === 'fail');
  const cols = Object.fromEntries(getMatrixCols(p).map(c => [c.key, c.label]));
  const mRows = mFails.map(([k]) => { const i = k.indexOf('_'); const fl = k.slice(0,i), col = k.slice(i+1); return `<tr><td class="c">${esc(fl)}</td><td>${esc(cols[col] || col)}</td></tr>`; }).join('');
  // pressure exceptions
  const pEx = Object.entries(p.floors).filter(([,d]) => pressFlag('dp', d.dp) || pressFlag('brk', d.brk) || pressFlag('swg', d.swg) || d.cl === 'fail');
  const blkLabel = pre => (pressBlocks(p).find(b => b.prefix === pre) || {}).label || pre;
  const pRows = pEx.map(([k,d]) => { const i = k.lastIndexOf('_'); return `<tr><td>${esc(blkLabel(k.slice(0,i)))}</td><td class="c">${esc(k.slice(i+1))}</td><td class="c ${pressFlag('dp',d.dp)?'fail':''}">${esc(d.dp || '')}</td><td class="c ${pressFlag('brk',d.brk)?'fail':''}">${esc(d.brk || '')}</td><td class="c ${pressFlag('swg',d.swg)?'fail':''}">${esc(d.swg || '')}</td><td class="c">${rvCell(d.cl)}</td></tr>`; }).join('');
  return `${docHeader(p, 'Smoke Control Inspection: Field Summary')}
    ${DISCLAIMER}
    <h2>Systems and progress</h2>
    <p>Systems present: ${esc(sys || 'none selected')}.</p>
    <table><tr><th>Results recorded</th><th>Complete</th><th>Failures</th><th>Deficiencies</th></tr>
      <tr><td class="c">${pr.done} of ${pr.total}</td><td class="c">${pr.pct}%</td><td class="c ${pr.fails?'fail':'pass'}">${pr.fails}</td><td class="c">${p.deficiencies.length}</td></tr></table>
    <h2>Equipment functional tests</h2>
    <table><tr><th>Tag</th><th>Type</th><th>Location</th><th>Tested</th><th>Result</th><th>Failed steps</th></tr>${eqRows || '<tr><td colspan="6">No equipment recorded.</td></tr>'}</table>
    ${visFails.length ? `<h2>Visual and system checks that failed</h2><table><tr><th>Item</th></tr>${visFails.map(v => `<tr><td>${esc(v.lbl)}</td></tr>`).join('')}</table>` : ''}
    ${zones.length ? `<h2>Lower-level zones</h2><table><tr><th>Zone</th><th>Room / area</th><th>Floor</th><th>Fans purge</th><th>Dampers</th><th>Adj. isolate</th><th>Note</th></tr>${zoneRows}</table>` : ''}
    ${mRows ? `<h2>Floor matrix failures</h2><table><tr><th>Level</th><th>System</th></tr>${mRows}</table>` : ''}
    <h2>Pressure and door force exceptions</h2>
    ${pRows ? `<table><tr><th>Shaft / door</th><th>Level</th><th>ΔP in. w.g.</th><th>Break lb</th><th>Swing lb</th><th>Close / latch</th></tr>${pRows}</table><p class="sub">Minimum 0.05 in. w.g.; maximum door force 30 lbf (NFPA 92 §6.4.2).</p>` : '<p>No pressure differential or door force readings fell outside NFPA 92 limits.</p>'}
    <h2>Deficiencies</h2>
    ${p.deficiencies.length ? p.deficiencies.map((d,i) => `<div class="item"><h3>${i+1}. ${esc(d.loc || 'Location not stated')} <span class="pill p-${d.sev === 'Deficiency' ? 'def' : d.sev === 'Observation' ? 'obs' : 'note'}">${esc(d.sev)}</span></h3><p>${esc(d.desc)}</p>${d.action ? `<p><b>Required corrective action:</b> ${esc(d.action)}</p>` : ''}${photoFigures(d.photos)}</div>`).join('') : '<p>No deficiencies recorded.</p>'}
    <div class="foot">${esc(p.info.company || 'Existing Building, LLC')} · ${esc(p.name)} · generated ${new Date().toLocaleString()}</div>`;
}

async function openFieldDoc(p, mode){
  // make sure photos referenced by deficiencies are in hand before rendering
  const need = [];
  for (const d of p.deficiencies) for (const pid of (d.photos || [])) if (!S.photos[pid]) need.push(pid);
  if (need.length) { toast('Fetching ' + need.length + ' photo' + (need.length>1?'s':'') + '…'); for (const pid of need) await fetchPhoto(p.id, pid); }
  const title = mode === 'defic' ? 'Deficiency List' : 'Field Summary';
  const body = mode === 'defic' ? deficiencyDoc(p) : summaryDoc(p);
  const root = $('#printRoot');
  root.innerHTML = `<div class="pbar"><b style="font-family:var(--font-head)">${esc(title)}</b><span class="grow"></span>
      <button id="pdfBtn" class="btn-primary btn-sm">Save as PDF</button><button id="shareBtn" class="btn-sm">Share</button><button id="closePrint" class="btn-sm">Close</button></div>
    <div class="doc" id="printDoc">${body}</div>`;
  root.classList.add('on');
  $('#closePrint').onclick = () => { root.classList.remove('on'); root.innerHTML = ''; };
  $('#pdfBtn').onclick = () => window.print();
  $('#shareBtn').onclick = async () => {
    const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.name)} ${esc(title)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap"><style>${PRINT_CSS.replace(/#printRoot\s?/g,'').replace(/body > \*\{display:none !important\}/,'')}</style></head><body><div class="doc">${body}</div></body></html>`;
    const fname = (p.name || 'building').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_') + '_' + (mode === 'defic' ? 'Deficiency_List' : 'Field_Summary') + '.html';
    const file = new File([html], fname, { type:'text/html' });
    try { if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title: p.name + ' ' + title }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type:'text/html' })); a.download = fname; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('Saved ' + fname);
  };
}

// inject the print stylesheet once
(function(){ const st = document.createElement('style'); st.textContent = PRINT_CSS; document.head.appendChild(st); })();

</script>
<script>
// ───────────────────────── Drawings & documents ─────────────────────────
// Everything that supports the record but is not the record: mechanical drawings, firefighter's
// panel photos, the remediation plan, and the documents the plugin skills produce. Tapping one
// keeps a copy on the device, so the drawing you opened at the truck is still there in the stair.
function viewFiles(p){
  const files = (p.files || []).slice().sort((a,b) => (a.kind === b.kind ? (b.added||'').localeCompare(a.added||'') : FILE_KINDS.findIndex(k => k.id === a.kind) - FILE_KINDS.findIndex(k => k.id === b.kind)));

      <select id="fKind" title="What kind of file">${FILE_KINDS.map(k => `<option value="${k.id}">${esc(k.label)}</option>`).join('')}</select>
    </div>
    <p class="hint">Pick the kind first, then add. Up to 25 MB each; split a large drawing set into single sheets so it opens quickly on a phone. Panel photos taken here are reference material, not deficiency photos; those belong on the deficiency itself.</p>`;
  const rows = files.length ? files.map(f => {
    const st = filePending(f) ? '<span class="flag">waiting to upload</span>' : (fileCached(f) ? '<span class="ok-tag">on this device</span>' : '<span class="faint">in the repository</span>');
    return `<div class="card file-card">

      <p class="small faint">${esc(kindLabel(f.kind))} · ${esc(fmtSize(f.size))} · ${esc(fmtDate(f.added))}${f.by ? ' · ' + esc(f.by) : ''} · ${st}</p></div>
      <div class="rowflex">

        <button class="btn-sm" data-fshare="${f.id}">Share</button>
        ${fileCached(f) ? '' : `<button class="btn-sm" data-fsave="${f.id}">Save offline</button>`}
        <button class="btn-sm btn-danger" data-fdel="${f.id}">Remove</button>
      </div></div>`;
  }).join('') : '<div class="empty">Nothing attached yet. Add the mechanical drawings and a firefighter\'s panel photo before the inspection, and they will be on every phone that opens this building.</div>';
  const bulk = files.length ? `<div class="rowflex" style="margin-top:10px"><button id="fAll">Save all for offline</button><span class="small faint">${offline} of ${files.length} on this device${pend ? `, ${pend} waiting to upload` : ''}</span></div>` : '';
  return sec('f_list', 'Drawings & documents', add + '<div class="rep">' + rows + '</div>' + bulk);
}

function bindFiles(root, p){
  const kind = () => ($('#fKind', root) || {}).value || 'other';
  const take = async (input) => {
    const list = [...(input.files || [])]; input.value = '';
    for (const file of list) {

      catch (e) { toast(e.message || 'Could not add that file'); }

  };
  const fa = $('#fAdd', root); if (fa) fa.onchange = () => take(fa);
  const fc = $('#fCam', root); if (fc) fc.onchange = () => take(fc);
  const find = id => (p.files || []).find(f => f.id === id);
  const withData = async (btn, id, fn) => {
    const f = find(id); if (!f) return;
    const old = btn.textContent; btn.disabled = true; btn.textContent = 'Loading…';
    try {
      const data = await fetchFileData(p.id, f);
      if (!data) { toast(S.online ? 'That file is not in the repository yet.' : 'Not on this device, and there is no signal.'); return; }
      await fn(f, data);
    } catch (e) { toast(e.message || 'Could not open that file'); }
    finally { btn.disabled = false; btn.textContent = old; render(); }
  };
  $$('[data-fopen]', root).forEach(b => b.onclick = () => withData(b, b.dataset.fopen, (f, d) => openFileViewer(f, d)));
  $$('[data-fsave]', root).forEach(b => b.onclick = () => withData(b, b.dataset.fsave, () => toast('Saved on this device')));
  $$('[data-fshare]', root).forEach(b => b.onclick = () => withData(b, b.dataset.fshare, async (f, d) => {
    const blob = fileToBlob(f, d); const file = new File([blob], f.name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: f.name }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 30000);
  }));
  $$('[data-fdel]', root).forEach(b => b.onclick = () => { const f = find(b.dataset.fdel); if (!f) return; confirmBox('Remove file', `Remove ${esc(f.name)} from this building, on every device?`, 'Remove', async () => { await removeFile(p.id, f); toast('Removed'); render(); }, true); });
  const all = $('#fAll', root);
  if (all) all.onclick = async () => {
    if (!S.online) return toast('No signal. Anything already saved is still available.');
    all.disabled = true; all.textContent = 'Saving…';
    const n = await cacheAllFiles(p.id);
    all.disabled = false; toast(n ? `Saved ${n} file${n>1?'s':''} for offline use` : 'Everything was already on this device'); render();
  };
}

// ── the firefighter's smoke control panel, on the Setup screen ──
// The panel photo is the thing everyone reaches for in the field: it settles what the zones are

const panelFiles = p => (p.files || []).filter(f => f.kind === 'fscp');
function panelBox(p){

      <span class="small">${esc(f.name)}</span></button>`).join('');
  return `<p class="hint">Photograph the panel face, and the zone or annunciator legend beside it. Everyone who opens this building gets the same picture, and tapping it once keeps it on the phone for the stair.</p>
    <div class="rowflex">

      <label class="btn-file">Add from this device<input type="file" accept="image/*,application/pdf" multiple hidden id="pnAdd"></label>
      ${fs.length ? '<button class="btn-sm" id="pnAll">See all drawings &amp; docs</button>' : ''}
    </div>

}
function bindPanel(root, p){
  const take = async input => {

    for (const file of list) { try { await addFile(p.id, file, 'fscp'); toast('Panel photo added'); } catch (e) { toast(e.message || 'Could not add that file'); } }

  // show the picture itself for anything already on the device

    idbGet(f.id, 'files').then(d => {
      if (!d) return;
      const btn = root.querySelector(`[data-fopen="${f.id}"]`); if (!btn) return;
      const img = new Image(); img.src = 'data:' + fileMime(f) + ';base64,' + d.b64; img.alt = f.name; img.className = 'panel-img';
      btn.prepend(img);
    });
  }
  $$('[data-fopen]', root).forEach(b => b.onclick = async () => {
    const f = (p.files || []).find(x => x.id === b.dataset.fopen); if (!f) return;

    try { const data = await fetchFileData(p.id, f); if (!data) return toast(S.online ? 'That photo is not in the repository yet.' : 'Not on this device, and there is no signal.'); openFileViewer(f, data); }
    catch (e) { toast(e.message || 'Could not open that photo'); }

// ── document rendering ──
// A home screen app cannot hand a PDF to the system viewer reliably, and a Word file not at all.
// So the app renders them itself: PDF pages are drawn to canvas, Word files are converted to
// readable HTML. Both engines are fetched once and then cached with the app, so a drawing opened
// on the truck still opens in the stair.
let pdfLib = null;
async function loadPdfLib(){
  if (pdfLib) return pdfLib;
  pdfLib = await import('./pdf.mjs');
  pdfLib.GlobalWorkerOptions.workerSrc = './pdf.worker.mjs';
  return pdfLib;
}
let mammothLoading = null;
function loadMammoth(){
  if (window.mammoth) return Promise.resolve(window.mammoth);
  if (!mammothLoading) mammothLoading = new Promise((res, rej) => { const s = document.createElement('script'); s.src = './mammoth.js'; s.onload = () => res(window.mammoth); s.onerror = () => { mammothLoading = null; rej(new Error('The Word viewer could not load. It needs a connection the first time.')); }; document.head.appendChild(s); });
  return mammothLoading;
}
const b64ToBytes = b64 => { const bin = atob(b64); const a = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i); return a; };

async function renderPdf(box, data, status){
  const lib = await loadPdfLib();
  const doc = await lib.getDocument({ data: b64ToBytes(data.b64) }).promise;
  status(`${doc.numPages} page${doc.numPages===1?'':'s'}`);
  box.innerHTML = '';
  const scale = Math.min(2.2, Math.max(1.2, (box.clientWidth || 700) / 640));
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n);
    const vp = page.getViewport({ scale: scale * 1.4 });
    const c = document.createElement('canvas');
    c.width = vp.width; c.height = vp.height; c.className = 'fv-page';
    box.appendChild(c);
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    if (n === 1) status(`${doc.numPages} page${doc.numPages===1?'':'s'}, pinch to zoom`);
  }
}
async function renderDocx(box, data, status){
  const m = await loadMammoth();
  const res = await m.convertToHtml({ arrayBuffer: b64ToBytes(data.b64).buffer });
  box.innerHTML = `<div class="fv-doc">${res.value}</div>`;
  status('converted for reading; open the file itself for the exact layout');
}

// Text out of a document, for the assistant. A scanned drawing has no text layer, so the caller
// is told to look at the page instead.
async function pdfExtractText(b64, maxChars = 12000){
  const lib = await loadPdfLib();
  const doc = await lib.getDocument({ data: b64ToBytes(b64) }).promise;
  let out = '';
  for (let n = 1; n <= doc.numPages && out.length < maxChars; n++) {
    const page = await doc.getPage(n);
    const tc = await page.getTextContent();
    const t = tc.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
    if (t) out += `\n[page ${n}] ` + t;
  }
  return { text: out.trim().slice(0, maxChars), pages: doc.numPages };
}
async function docxExtractText(b64, maxChars = 12000){
  const m = await loadMammoth();
  const res = await m.convertToHtml({ arrayBuffer: b64ToBytes(b64).buffer });
  const t = res.value.replace(/<\/(p|div|h\d|li|tr)>/g, '\n').replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n').trim();
  return { text: t.slice(0, maxChars) };
}
// One PDF page as a JPEG, sized for the model rather than the screen.
async function pdfPageJpeg(b64, pageNo, maxEdge = 1500){
  const lib = await loadPdfLib();
  const doc = await lib.getDocument({ data: b64ToBytes(b64) }).promise;
  const n = Math.max(1, Math.min(doc.numPages, +pageNo || 1));
  const page = await doc.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(4, maxEdge / Math.max(base.width, base.height));
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return { b64: c.toDataURL('image/jpeg', 0.82).split(',')[1], page: n, pages: doc.numPages };
}

// A viewer that works inside a home-screen app, where a blob URL in a new tab is often blocked.
function openFileViewer(f, data){
  const blob = fileToBlob(f, data); const url = URL.createObjectURL(blob);
  const ext = f.ext || fileExt(f.name);
  modal(`<h3 style="margin-bottom:6px">${esc(f.name)}</h3><div class="small faint" id="fvInfo" style="margin-bottom:8px">${esc(kindLabel(f.kind))} &middot; ${esc(fmtSize(f.size))}</div>
    <div class="fv" id="fvBody"><div class="empty small">Opening…</div></div>
    <div class="acts"><button id="fvShare">Share or save</button><button id="fvClose" class="btn-primary">Close</button></div>`, () => {
    const body = $('#fvBody'), info = $('#fvInfo');
    const status = s => { if (info) info.textContent = `${kindLabel(f.kind)} · ${fmtSize(f.size)} · ${s}`; };
    $('#fvClose').onclick = () => { closeModal(); URL.revokeObjectURL(url); };
    $('#fvShare').onclick = async () => {
      const file = new File([blob], f.name, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: f.name }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
      const a = document.createElement('a'); a.href = url; a.download = f.name; a.click();
    };
    if (isImageFile(f)) { body.innerHTML = `<img src="${url}" alt="${esc(f.name)}" class="fv-img">`; return; }
    if (isPdfFile(f)) { renderPdf(body, data, status).catch(e => { console.warn(e); body.innerHTML = `<iframe src="${url}" class="fv-frame" title="${esc(f.name)}"></iframe>`; status('shown with the built-in viewer'); }); return; }
    if (ext === 'docx') { renderDocx(body, data, status).catch(e => { body.innerHTML = `<div class="empty small">${esc(e.message || 'This Word file could not be shown here.')} Use Share to open it in another app.</div>`; }); return; }
    body.innerHTML = `<div class="empty small">${esc(f.name)} cannot be shown here. Use Share to open it in another app.</div>`;
  });
}

<script>
// ───────────────────────── field copies and the end-of-day merge ─────────────────────────
// Two inspectors testing the same tower at once should not be writing into one record and trusting a
// merge they never see. Each takes a field copy: a record of its own, syncing on its own, incapable
// of touching anyone else's entries. At the end of the day the copies are merged back into the
// building, and anything the two of them answered differently is put in front of a person.
const laneName = p => p.lane || 'field copy';
const isLane = p => !!p.parentId;
const lanesOf = id => Object.values(S.projects).filter(p => p.parentId === id && p.status !== 'trash' && !p.mergedAt);
const mergedLanesOf = id => Object.values(S.projects).filter(p => p.parentId === id && p.mergedAt);

function createLane(parentId, who){
  const parent = S.projects[parentId]; if (!parent) return null;
  const c = clone(parent);
  c.id = parentId + '__' + (who.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid(''));
  if (S.projects[c.id]) { toast(who + ' already has a field copy of this building.'); return S.projects[c.id]; }
  c.parentId = parentId; c.lane = who; c.mergedAt = '';
  c.name = parent.name + ' (' + who + ')';   // the naming protocol the field team already uses
  c.created = c.updated = new Date().toISOString();
  // results start empty: a field copy carries the building, not anyone else's answers
  c.seqResults = {}; c.matrixResults = {}; c.zoneResults = {}; c.floors = {}; c.deficiencies = []; c._conflicts = [];
  c.info = { ...parent.info, inspector: who };
  S.projects[c.id] = c; S.dirty.add(c.id); persist(); scheduleSync();
  return c;
}

// ── what a merge would do ──
// Anything only one person answered is taken. Anything two answered the same way is agreement.
// Anything two answered differently is a disagreement, and a person decides.
const RESULT_MAPS = ['seqResults','matrixResults','zoneResults'];
function planMerge(parent, lanes){
  const takes = [], clashes = [];
  const note = (path, label, value, from) => takes.push({ path, label, value, from });
  for (const map of RESULT_MAPS) {
    const keys = new Set(lanes.flatMap(l => Object.keys(l[map] || {})));
    for (const k of keys) {
      const answers = lanes.map(l => ({ who: laneName(l), v: (l[map] || {})[k] })).filter(a => a.v !== '' && a.v != null);
      if (!answers.length) continue;
      const base = (parent[map] || {})[k] || '';
      const distinct = [...new Set(answers.map(a => a.v))];
      if (distinct.length > 1) clashes.push({ kind:'map', map, key:k, label: resultLabel(parent, map, k), base, answers });
      else if (distinct[0] !== base) note(map + '.' + k, resultLabel(parent, map, k), distinct[0], answers.map(a => a.who).join(' and '));
    }
  }
  // pressure and door forces: one row per location, several readings on each row
  const floorKeys = new Set(lanes.flatMap(l => Object.keys(l.floors || {})));
  for (const k of floorKeys) {
    const fields = new Set(lanes.flatMap(l => Object.keys((l.floors || {})[k] || {})));
    for (const f of fields) {
      const answers = lanes.map(l => ({ who: laneName(l), v: (((l.floors || {})[k]) || {})[f] })).filter(a => a.v !== '' && a.v != null);
      if (!answers.length) continue;
      const base = ((parent.floors || {})[k] || {})[f] ?? '';
      const distinct = [...new Set(answers.map(a => String(a.v)))];
      if (distinct.length > 1) clashes.push({ kind:'floor', key:k, field:f, label: `${k.replace(/_/g,' ')} · ${FLOOR_FIELDS[f] || f}`, base, answers });
      else if (String(distinct[0]) !== String(base)) note(`floors.${k}.${f}`, `${k.replace(/_/g,' ')} · ${FLOOR_FIELDS[f] || f}`, answers[0].v, answers.map(a => a.who).join(' and '));
    }
  }
  // deficiencies, attachments and equipment additions are all additive
  const newDefs = [], newFiles = [], newEquip = [];
  for (const l of lanes) {
    for (const d of (l.deficiencies || [])) if (!parent.deficiencies.some(x => x.id === d.id)) newDefs.push({ ...d, _by: laneName(l) });
    for (const f of (l.files || [])) if (!(parent.files || []).some(x => x.id === f.id)) newFiles.push({ ...f, _by: laneName(l) });
    for (const e of (l.equipment || [])) if (!parent.equipment.some(x => x.tag === e.tag)) newEquip.push({ ...e, _by: laneName(l) });
  }
  return { takes, clashes, newDefs, newFiles, newEquip,
           total: takes.length + newDefs.length + newFiles.length + newEquip.length };
}
const FLOOR_FIELDS = { dp:'pressure difference', brk:'door opening force', swg:'closing force', cl:'closer / latching' };
function resultLabel(p, map, key){
  if (map === 'zoneResults') { const [zone, what] = key.split(/_(fans|dampers|isolate)$/); return `${zone} ${what || ''}`.trim(); }
  if (map === 'matrixResults') return 'matrix ' + key.replace(/_/g, ' ');
  const t = [...VISUAL_ITEMS, ...FAULT_TESTS, ...EMERG_TESTS, ...INIT_TESTS].find(x => x.id === key);
  if (t) return t.label || t.id;
  const m = /^(.+)_(\d+)$/.exec(key);
  if (m) { const e = p.equipment.find(x => x.tag === m[1]); const tests = e ? getSeqTests(e) : []; return `${m[1]} · ${(tests[+m[2]] || {}).action || 'test ' + m[2]}`; }
  return key;
}

function applyMerge(parentId, plan, picks){
  updateProject(parentId, p => {
    for (const t of plan.takes) setPath(p, t.path, t.value);
    plan.clashes.forEach((c, i) => {
      const chosen = picks[i]; if (chosen === undefined || chosen === null) return;     // left alone on purpose
      if (c.kind === 'map') p[c.map][c.key] = chosen;
      else { p.floors[c.key] = p.floors[c.key] || {}; p.floors[c.key][c.field] = chosen; }
    });
    for (const d of plan.newDefs) p.deficiencies.push(stripBy(d));
    for (const f of plan.newFiles) p.files = [...(p.files || []), stripBy(f)];
    for (const e of plan.newEquip) p.equipment.push(stripBy(e));
    p._merges = [...(p._merges || []), { at: new Date().toISOString(), by: S.me || S.clientId, lanes: plan.lanes || [], took: plan.takes.length, decided: plan.clashes.length, defs: plan.newDefs.length }].slice(-20);
    return p;
  });
}
const stripBy = o => { const c = { ...o }; delete c._by; return c; };

// The line on a building card that shows who is working separately on it.
function laneStrip(p){
  const ls = lanesOf(p.id), merged = mergedLanesOf(p.id);
  if (!ls.length && !merged.length) return '';
  const one = l => { const pr = progress(l); return `<button class="btn-sm" data-act="open" data-id="${l.id}">${esc(laneName(l))} · ${pr.done}/${pr.total}${S.dirty.has(l.id) ? ' · unsynced' : ''}</button>`; };
  return `<div class="lanes">${ls.length ? `<span class="small faint">Testing separately:</span>${ls.map(one).join('')}` : ''}
    ${merged.length ? `<span class="small faint">${merged.length} copy${merged.length===1?'':'ies'} already merged</span>` : ''}</div>`;
}

// ── the screen ──
function mergeDialog(parentId){
  const parent = S.projects[parentId];
  const lanes = lanesOf(parentId);
  if (!lanes.length) return toast('No field copies to merge.');
  const plan = planMerge(parent, lanes);
  plan.lanes = lanes.map(laneName);
  const picks = plan.clashes.map(() => undefined);
  const stale = lanes.filter(l => S.dirty.has(l.id));
  const body = () => `
    <p class="hint">Merging ${lanes.map(l => `<b>${esc(laneName(l))}</b>`).join(' and ')} into <b>${esc(parent.name)}</b>.
    ${stale.length ? `<span class="flag">${stale.length === 1 ? 'One copy has' : stale.length + ' copies have'} entries still waiting to upload. Merge once ${stale.length === 1 ? 'it has' : 'they have'} synced, or those entries will not be in this merge.</span>` : 'All copies are synced.'}</p>
    <div class="kv"><dt>Taken as entered</dt><dd>${plan.takes.length} result${plan.takes.length===1?'':'s'}</dd>
      <dt>New deficiencies</dt><dd>${plan.newDefs.length}</dd>
      <dt>New attachments</dt><dd>${plan.newFiles.length}</dd>
      <dt>Needing a decision</dt><dd>${plan.clashes.length ? `<span class="flag">${plan.clashes.length}</span>` : 'none'}</dd></div>
    ${plan.clashes.length ? `<div class="lbl" style="margin-top:12px">Answered differently</div>
      <p class="hint">Two people recorded different answers for the same thing. Pick the one that goes on the record. Anything left unpicked keeps what the building record says now.</p>
      ${plan.clashes.map((c, i) => `<div class="card small"><div><b>${esc(c.label)}</b></div>
        <div class="rowflex" style="margin-top:6px">
          ${c.answers.map(a => `<button class="btn-sm" data-pick="${i}" data-val="${esc(String(a.v))}">${esc(a.who)}: <b>${esc(String(a.v))}</b></button>`).join('')}
          ${c.base !== '' && c.base != null ? `<button class="btn-sm" data-pick="${i}" data-val="${esc(String(c.base))}">keep current: ${esc(String(c.base))}</button>` : ''}
        </div>
        <div class="small faint" id="pk${i}">no decision yet</div></div>`).join('')}` : ''}
    ${plan.newDefs.length ? `<div class="lbl" style="margin-top:12px">Deficiencies coming across</div><ul class="small muted">${plan.newDefs.slice(0,12).map(d => `<li>${esc(d._by)}: ${esc(d.loc || '')} ${esc(d.desc || '')}</li>`).join('')}${plan.newDefs.length>12?`<li>and ${plan.newDefs.length-12} more</li>`:''}</ul>` : ''}`;
  modal(`<h3>Merge field copies</h3><div id="mg_body">${body()}</div>
    <div class="acts"><button id="mCancel">Cancel</button><button id="mOk" class="btn-primary">Merge into the building</button></div>`, () => {
    const bind = () => {
      $$('[data-pick]').forEach(b => b.onclick = () => {
        const i = +b.dataset.pick; picks[i] = b.dataset.val;
        $$(`[data-pick="${i}"]`).forEach(x => x.classList.remove('btn-primary'));
        b.classList.add('btn-primary');
        const lbl = $('#pk' + i); if (lbl) lbl.textContent = 'will record: ' + b.dataset.val;
      });
    };
    bind();
    $('#mCancel').onclick = closeModal;
    $('#mOk').onclick = () => {
      const undecided = plan.clashes.filter((c, i) => picks[i] === undefined).length;
      const go2 = () => {
        applyMerge(parentId, plan, picks);
        const when = new Date().toISOString();
        for (const l of lanes) updateProject(l.id, x => { x.mergedAt = when; x.mergedInto = parentId; return x; }, { silent:true });
        persist(); scheduleSync(); closeModal(); go('setup', parentId);
        toast(`Merged ${plan.total} entr${plan.total===1?'y':'ies'} from ${lanes.length} field cop${lanes.length===1?'y':'ies'}.`);
      };
      if (undecided) confirmBox('Merge with undecided items?', `${undecided} disagreement${undecided===1?'':'s'} ${undecided===1?'has':'have'} no decision. The building record keeps what it has now for ${undecided===1?'that one':'those'}, and the field copies are kept so you can look again.`, 'Merge anyway', go2);
      else go2();
    };
  });
}

<script>
// ───────────────────────── device setup: share, apply, diagnose ─────────────────────────
// Typing a 93-character token into a phone is how teams give up. A device that already works can
// hand its settings to another device as a link or a QR code, and the new device takes them in one
// paste or one camera scan. The link carries a real credential, so it is treated like a password.
const b64url = {
  enc: s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec: s => decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))))
};
function setupCode(withKey){
  const payload = { o: S.cfg.owner, r: S.cfg.repo, t: S.cfg.token };
  if (withKey && S.cfg.anthropicKey) { payload.k = S.cfg.anthropicKey; payload.m = S.cfg.model; }
  return b64url.enc(JSON.stringify(payload));
}
const setupLink = withKey => location.origin + location.pathname + '#s=' + setupCode(withKey);

function parseSetup(text){
  let s = (text || '').trim();
  const at = s.indexOf('#s=');
  if (at >= 0) s = s.slice(at + 3);
  s = s.split(/[\s&]/)[0];
  if (!s) throw new Error('That is empty.');
  let obj; try { obj = JSON.parse(b64url.dec(s)); } catch { throw new Error('That does not look like a setup link. Copy the whole link, including the part after the #.'); }
  if (!obj || !obj.o || !obj.r || !obj.t) throw new Error('That setup link is incomplete.');
  return obj;
}
function applySetup(obj){
  S.cfg.owner = obj.o; S.cfg.repo = obj.r; S.cfg.token = obj.t;
  if (obj.k) S.cfg.anthropicKey = obj.k;
  if (obj.m) S.cfg.model = obj.m;
  saveCfg(); persist(); S.ghOk = null; S.lastPull = 0; updateSyncBadge();
}

// Everything a device needs after taking settings in, without a trip through Settings: the config is
// already written to this device, so this connects, pulls the buildings, and asks only for the one
// thing that cannot be copied from another phone, which is who is holding this one.
async function finishSetup(how){
  toast(how + '. Connecting…');
  try { const r = await ghTest(); toast(`Connected to ${r.full_name}. Loading the buildings…`); await syncNow(true); }
  catch (e) { toast('Saved on this device, but could not connect: ' + (e && e.message ? e.message : 'no answer from GitHub.')); }
  render();
  if (!S.me) promptBox('Who is using this device?', 'Inspector name (stamps your entries)', '', 'Save', v => { S.me = v; lsSet(LS.me, v); saveCfg(); toast('Ready. Nothing else to set up.'); render(); });
}

// Shown on a device that is already working.
function shareSetupDialog(){
  if (!ghConfigured()) return toast('Set this device up first, then it can pass the settings on.');
  modal(`<h3>Set up another device</h3>
    <p class="hint">This carries the access token, so treat it like a password: show the code to someone standing next to you, or send the link the way you would send a password. Anyone holding it can read and write this building data until the token is revoked.</p>
    <label class="chk"><input type="checkbox" id="sh_key" ${S.cfg.anthropicKey ? '' : 'disabled'}> Include the assistant key as well</label>
    <div id="sh_qr" style="margin:12px 0"></div>
    <p class="hint"><b>On the other phone:</b> open <span class="mono">${esc(location.origin + location.pathname)}</span> in Safari, Share &rarr; Add to Home Screen, and open it from the Home Screen. Then Settings &rarr; <b>Scan setup code</b> and point it at this screen. The home screen app keeps its own settings, so it has to be set up from inside the app, not in Safari.</p>
    <div class="acts"><button id="sh_copy">Copy setup link</button><button id="mOk" class="btn-primary">Done</button></div>`, () => {
    const draw = () => { const box = $('#sh_qr'); box.innerHTML = ''; try { box.appendChild(qrCanvas(setupLink($('#sh_key').checked), 5)); } catch (e) { box.innerHTML = '<div class="empty small">The code is too long to show. Use Copy setup link instead.</div>'; } };
    draw();
    $('#sh_key').onchange = draw;
    $('#sh_copy').onclick = () => { const link = setupLink($('#sh_key').checked); navigator.clipboard.writeText(link).then(() => toast('Setup link copied. Send it like a password.')).catch(() => toast('Copy failed; use the QR code instead.')); };
    $('#mOk').onclick = closeModal;
  });
}

// Shown on the device being set up.
function pasteSetupDialog(){
  modal(`<h3>Paste setup link</h3>
    <p class="hint">Paste the link or code you were sent. It fills in the repository, the token and the assistant key in one go, so nothing has to be typed.</p>
    <div class="field"><textarea id="ps_in" rows="4" placeholder="https://…/#s=…" autocapitalize="off" spellcheck="false"></textarea></div>
    <div id="ps_msg" class="small muted"></div>
    <div class="acts"><button id="mCancel">Cancel</button><button id="mOk" class="btn-primary">Set up this device</button></div>`, () => {
    $('#ps_in').focus();
    $('#mCancel').onclick = closeModal;
    $('#mOk').onclick = async () => {
      const m = $('#ps_msg');
      let obj; try { obj = parseSetup($('#ps_in').value); } catch (e) { m.textContent = e.message; return; }
      applySetup(obj); closeModal(); finishSetup('Saved on this device');
    };
  });
}

// Scanning with the camera, inside the app. On an iPhone the home-screen app has its own storage,
// separate from Safari, so opening a setup link in Safari does nothing for the installed app. This
// is the path that actually works there: install first, then scan the code off the other screen.
// The decoder is fetched on demand rather than bundled, since it is only needed at setup.
let jsqrLoading = null;
function loadScanner(){
  if (window.jsQR) return Promise.resolve(true);
  if (!jsqrLoading) jsqrLoading = new Promise((res, rej) => { const s = document.createElement('script'); s.src = './jsqr.js'; s.onload = () => res(true); s.onerror = () => { jsqrLoading = null; rej(new Error('The scanner could not load. It needs a connection the first time.')); }; document.head.appendChild(s); });
  return jsqrLoading;
}
async function scanSetupDialog(){
  modal(`<h3>Scan setup code</h3>
    <p class="hint">On the device that already works, open Settings and tap <b>Set up another device</b>. Point this camera at the code on its screen.</p>
    <div class="scan"><video id="sc_v" playsinline muted></video></div>
    <div id="sc_msg" class="small muted" style="margin-top:8px">Starting the camera…</div>
    <div class="acts"><button id="sc_paste">Paste a link instead</button><button id="mOk" class="btn-primary">Cancel</button></div>`, () => {});
  const msg = t => { const m = $('#sc_msg'); if (m) m.textContent = t; };
  let stream = null, raf = null, done = false;
  const stop = () => { done = true; if (raf) cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t => t.stop()); };
  $('#mOk').onclick = () => { stop(); closeModal(); };
  $('#sc_paste').onclick = () => { stop(); closeModal(); pasteSetupDialog(); };
  try { await loadScanner(); } catch (e) { msg(e.message); return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
  catch (e) {
    msg(e && e.name === 'NotAllowedError'
      ? 'The camera was refused. Allow it in Settings, or use Paste a link instead.'
      : 'No camera available here. Use Paste a link instead.');
    return;
  }
  const v = $('#sc_v'); if (!v) { stop(); return; }
  v.srcObject = stream; await v.play().catch(() => {});
  msg('Point at the code.');
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  const tick = () => {
    if (done) return;
    if (v.readyState === v.HAVE_ENOUGH_DATA) {
      cv.width = v.videoWidth; cv.height = v.videoHeight;
      cx.drawImage(v, 0, 0, cv.width, cv.height);
      const img = cx.getImageData(0, 0, cv.width, cv.height);
      const hit = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (hit && hit.data) {
        let obj = null; try { obj = parseSetup(hit.data); } catch (e) { msg('That code is not an SC Inspect setup code.'); }
        if (obj) {
          stop(); applySetup(obj); closeModal(); finishSetup('Scanned and saved'); return;
        }
      }
    }
    raf = requestAnimationFrame(tick);
  };
  tick();
}

// A setup link opened in the browser. Never applied silently.
function setupFromHash(){
  const h = location.hash || '';
  if (h.indexOf('#s=') !== 0) return false;
  let obj; try { obj = parseSetup(h); } catch { return false; }
  history.replaceState(null, '', location.pathname + location.search);   // keep the token out of the address bar
  confirmBox('Set up this device?', `This link sets this device up for <b>${esc(obj.o)}/${esc(obj.r)}</b> and installs an access token for the inspection data. Only accept it if you asked for it.`, 'Set up', async () => {
    applySetup(obj); finishSetup('Saved on this device');
  });
  return true;
}

// One screen that answers "why does it not work here", in a form that can be pasted into a chat.
async function diagnosticsDialog(){
  modal(`<h3>Connection check</h3><p class="hint">Running the same requests the app makes, and reporting exactly what comes back. No secrets are included, so this is safe to send.</p>
    <pre class="prompt" id="dg_out">Checking…</pre>
    <div class="acts"><button id="dg_copy">Copy</button><button id="mOk" class="btn-primary">Close</button></div>`, () => {
    $('#mOk').onclick = closeModal;
    $('#dg_copy').onclick = () => navigator.clipboard.writeText($('#dg_out').textContent).then(() => toast('Copied')).catch(() => toast('Copy failed; read it out instead.'));
  });
  const t = S.cfg.token || '', k = S.cfg.anthropicKey || '';
  const lines = [
    'SC Inspect check ' + new Date().toLocaleString(),
    'build ' + BUILD,
    'device ' + (navigator.userAgent.match(/(iPhone|iPad|Android|Macintosh|Windows)[^;)]*/) || ['unknown'])[0] + (window.matchMedia('(display-mode: standalone)').matches ? ', home screen app' : ', browser tab'),
    'online flag ' + S.online,
    'owner/repo ' + (S.cfg.owner || '(blank)') + '/' + (S.cfg.repo || '(blank)'),
    'token ' + (t ? `present, ${t.length} characters, starts ${t.slice(0,11)}${/\s/.test(t) ? ', CONTAINS A SPACE' : ''}${t.length < 40 ? ', LOOKS TRUNCATED' : ''}` : 'MISSING'),
    'assistant key ' + (k ? `present, starts ${k.slice(0,7)}` : 'not set'),
    'buildings on this device ' + Object.keys(S.projects).length + ', waiting to upload ' + S.dirty.size,
  ];
  const show = () => { const el = $('#dg_out'); if (el) el.textContent = lines.join('\n'); };
  show();
  // plain reachability, no credentials, so a network block shows up as itself
  try { await fetch('https://api.github.com/zen', { cache:'no-store' }); lines.push('reach api.github.com: yes'); }
  catch { lines.push('reach api.github.com: NO (blocked or no signal, before any token is involved)'); }
  show();
  if (t) { try { const r = await ghTest(); lines.push(`repository: connected to ${r.full_name}`); } catch (e) { lines.push('repository: ' + (e.message || 'failed')); } show(); }
  if (k) { try { await anthropicCall([{ role:'user', content:'ping' }], [], undefined); lines.push('assistant: replied'); } catch (e) { lines.push('assistant: ' + (apiError ? apiError(e) : (e.message || 'failed'))); } show(); }
  lines.push('checked at ' + new Date().toLocaleTimeString());
  show();
}

</script>
<script>
// ───────────────────────── view bindings + boot ─────────────────────────
function bindView(root, p){
  if (S.view === 'home') return bindHome(root);
  if (!p) return;
  ({ setup:bindSetup, equip:bindEquip, seq:bindSeq, matrix:() => {}, zones:() => {}, press:bindPress, defic:bindDefic, files:bindFiles, reports:bindReports })[S.view](root, p);
}
function settingsDialog(){
  const c = S.cfg;
  modal(`<h3>Settings</h3>
    <div class="lbl">Team repository (GitHub)</div>
    <p class="hint" style="margin-bottom:8px">Owner and repository are already filled in. Paste the access token, add your name, then Test connection.</p>
    <div class="row2"><div class="field"><label class="lbl" for="st_owner">Owner (account or organization)</label><input id="st_owner" value="${esc(c.owner)}" placeholder="wfletcher13" autocapitalize="off"></div><div class="field"><label class="lbl" for="st_repo">Data repository</label><input id="st_repo" value="${esc(c.repo)}" placeholder="sc-inspect-data" autocapitalize="off"></div></div>
    <div class="field"><label class="lbl" for="st_token">Access token</label><input id="st_token" type="password" value="${esc(c.token)}" placeholder="github_pat_…" autocapitalize="off"><div class="small faint">Fine-grained token with Contents read/write on the data repository. Stays on this device.</div></div>
    <div class="lbl" style="margin-top:8px">Assistant (optional)</div>
    <div class="row2"><div class="field"><label class="lbl" for="st_key">Anthropic API key</label><input id="st_key" type="password" value="${esc(c.anthropicKey)}" placeholder="sk-ant-…" autocapitalize="off"></div><div class="field"><label class="lbl" for="st_model">Model</label><input id="st_model" value="${esc(c.model)}" autocapitalize="off"></div></div>
    <div class="field"><label class="lbl" for="st_me">Inspector name (this device)</label><input id="st_me" value="${esc(S.me)}"></div>
    <div class="field"><div class="lbl">Appearance (this device)</div>
      <div class="seg" id="st_theme">
        <button data-theme="light">Light</button><button data-theme="dark">Dark</button><button data-theme="auto">Auto</button>
      </div>
      <div class="small faint">Light reads better in daylight. Dark saves battery on a phone screen and is easier at night. Auto follows the device.</div></div>
    <div class="rowflex" style="margin-top:10px"><button id="st_scan" class="btn-primary">Scan setup code</button><button id="st_paste">Paste setup link</button><button id="st_share">Set up another device</button><button id="st_diag">Connection check</button></div>
    <div id="st_msg" class="small muted" style="margin-top:8px"></div>
    <div class="rowflex" style="margin-top:8px"><button id="st_update">Check for app update</button></div>
    <div class="small faint" style="margin-top:6px">App build ${BUILD}</div>
    <div class="acts"><button id="st_test">Test repository</button><button id="st_testai">Test assistant</button><button id="mCancel">Cancel</button><button id="mOk" class="btn-primary">Save</button></div>`, () => {
    const paintTheme = () => $$('#st_theme button').forEach(b => b.classList.toggle('on', b.dataset.theme === currentTheme()));
    paintTheme();
    $$('#st_theme button').forEach(b => b.onclick = () => { applyTheme(b.dataset.theme); paintTheme(); });
    const read = () => { S.cfg.owner = $('#st_owner').value.trim(); S.cfg.repo = $('#st_repo').value.trim(); S.cfg.token = $('#st_token').value.trim(); S.cfg.anthropicKey = $('#st_key').value.trim(); S.cfg.model = $('#st_model').value.trim() || 'claude-sonnet-5'; S.me = $('#st_me').value.trim(); saveCfg(); lsSet(LS.me, S.me); };
    $('#mCancel').onclick = closeModal;
    $('#st_update').onclick = async () => { $('#st_msg').textContent = 'Checking…'; try { if (window.swReg) { await window.swReg.update(); } $('#st_msg').textContent = 'Checked. If a new build was found the app reloads on its own in a moment.'; setTimeout(() => location.reload(), 1500); } catch (e) { $('#st_msg').textContent = 'Could not check: ' + e.message; } };
    $('#st_scan').onclick = () => { read(); scanSetupDialog(); };
    $('#st_paste').onclick = () => { read(); pasteSetupDialog(); };
    $('#st_share').onclick = () => { read(); shareSetupDialog(); };
    $('#st_diag').onclick = () => { read(); diagnosticsDialog(); };
    $('#st_test').onclick = async () => { read(); const m = $('#st_msg');
      if (!S.cfg.token) { m.textContent = 'No access token on this device yet. Paste the github_pat_… value into the box above, then test again.'; return; }
      if (!S.cfg.owner || !S.cfg.repo) { m.textContent = 'Owner and data repository must both be filled in (wfletcher13 and sc-inspect-data).'; return; }
      m.textContent = 'Testing…'; try { const r = await ghTest(); m.textContent = `Connected to ${r.full_name} (${r.private ? 'private' : 'public'}).`; } catch (e) { m.textContent = 'Could not connect: ' + (e && e.message ? e.message : 'no answer from GitHub, and the browser gave no reason. Check that the token box is not empty, then try cellular instead of wifi.'); } };
    $('#st_testai').onclick = async () => { read(); const m = $('#st_msg'); if (!S.cfg.anthropicKey) { m.textContent = 'Add an Anthropic API key first, or leave it blank to work without the assistant.'; return; } m.textContent = 'Asking Claude…'; try { const r = await anthropicCall([{ role:'user', content:'Reply with the single word: ready' }], [], undefined); const t = (r.content||[]).filter(c=>c.type==='text').map(c=>c.text).join(' ').trim(); m.textContent = 'Assistant replied: ' + (t || '(empty)') + '  ·  model ' + (r.model || S.cfg.model); } catch (e) { m.textContent = apiError(e); } };
    $('#mOk').onclick = () => { read(); closeModal(); S.ghOk = null; S.lastPull = 0; render(); if (ghConfigured() && S.online) { toast('Saved. Syncing…'); syncNow(true); } };
  });
}
async function boot(){
  applyTheme();
  $('#btnNewSide').onclick = newBuilding; $('#btnHomeSide').onclick = () => go('home');
  $('#btnSettingsSide').onclick = settingsDialog;
  chatInit();
  // Heal records stored by a build that dropped the record id on sync: the store key is the truth.
  // Without this, a device that synced before the fix keeps a broken copy forever, because an
  // unchanged blob sha makes the next pull skip the record entirely.
  let healed = 0;
  for (const [k, p] of Object.entries(S.projects)) if (p && p.id !== k) { p.id = k; healed++; }
  for (const [k, p] of Object.entries(S.base)) if (p && p.id !== k) p.id = k;
  if (healed) persist();
  for (const [id, p] of Object.entries(S.projects)) { if ((p.schemaVersion || 1) < SCHEMA_VERSION) { S.projects[id] = normalizeProject({ ...p, id }); S.dirty.add(id); } }
  render();
  await loadPhotosCache();
  if ('serviceWorker' in navigator) {
    try {
      // updateViaCache:'none' stops the browser serving sw.js from its own cache, which is what
      // kept a phone on an old build even after reopening the app.
      const reg = await navigator.serviceWorker.register('./sw.js', { updateViaCache:'none' });
      window.swReg = reg;
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
      setInterval(() => reg.update().catch(() => {}), 15 * 60 * 1000);
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; location.reload(); });
      reg.addEventListener('updatefound', () => { const nw = reg.installing; nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('New build installing…'); }); });
    } catch (e) { console.warn('sw', e); }
  }
  const fromLink = setupFromHash();
  if (!fromLink && !ghConfigured() && !Object.keys(S.projects).length) settingsDialog();
  if (ghConfigured() && S.online) scheduleSync(300);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persist(); else if (ghConfigured() && S.online) scheduleSync(500); });
  setInterval(() => { if (ghConfigured() && S.online && !S.syncing && document.visibilityState === 'visible') syncNow(); }, 45000);
}
boot();

</script>
</body>
